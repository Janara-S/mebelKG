  // Шаг 3: цвета мебели
  const ndecor = Object.assign({}, MP.defaultDecor);
  const swBg = (d) => d.pattern === 'wood' ? `repeating-linear-gradient(100deg, ${d.color} 0 5px, rgba(60,35,10,.18) 5px 6px)` : d.pattern === 'marble' ? `linear-gradient(135deg, ${d.color} 40%, #a9a9b2 46%, ${d.color} 54%)` : d.color;
  const decorUI = () => document.getElementById('new-decor').innerHTML = Object.keys(MP.decorLabels).map((k) => `<div class="p-3 rounded-xl bg-surface-container-low flex flex-col gap-2"><div class="flex items-baseline justify-between gap-2"><span class="font-label-md text-label-md font-semibold">${MP.decorLabels[k]}</span><span class="font-label-sm text-label-sm text-on-surface-variant truncate">${MP.esc(MP.decor(k, ndecor[k]).name)}</span></div><div class="flex flex-wrap gap-1.5">${MP.decors[k].map((d) => `<button type="button" data-nd="${k}" data-key="${d.key}" title="${MP.esc(d.name)}" aria-label="${MP.esc(d.name)}" class="w-8 h-8 rounded-full border-2 hover:scale-110 transition-transform ${d.key === ndecor[k] ? 'border-primary ring-2 ring-primary/40' : 'border-white shadow'}" style="background:${swBg(d)}"></button>`).join('')}</div></div>`).join('');
  document.getElementById('new-decor').addEventListener('click', (e) => { const b = e.target.closest('[data-nd]'); if (b) { ndecor[b.dataset.nd] = b.dataset.key; decorUI(); } });
  decorUI();
  document.getElementById('new-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fm = e.target.elements, title = fm.title.value.trim();
    if (!title) { fm.title.focus(); return; }
    const num = 112 + extra.length;
    extra.unshift({ id: '2025-' + num, title, client: fm.client.value.trim() || 'Без заказчика', phone: '', place: `${fm.L.value}×${fm.W.value}×${fm.H.value} мм`, category: TYPES[type][0], stage: 'measure', price: 0, paid: 0, note: 'Черновик', material: TYPES[type][2] + ', ' + MP.decor('facade', ndecor.facade).name + ', ' + MP.decor('carcass', ndecor.carcass).name, updated: 'сейчас', isNew: true });
    // Комната из формы + шаблон под тип мебели (дальше всё правится в 3D)
    const rm = { L: Math.min(12000, Math.max(1500, Math.round(+fm.L.value) || 3400)), W: Math.min(12000, Math.max(1500, Math.round(+fm.W.value) || 2600)), H: Math.min(4000, Math.max(2200, Math.round(+fm.H.value) || 2750)) };
    const tplKey = ['straight-island', 'wardrobe', 'wardrobe', 'wardrobe', 'empty', 'hallway', 'empty', 'empty', 'empty'][type];
    const tpl = MP.templates.find((x) => x.key === (tplKey === 'straight-island' && rm.W < 2500 ? 'straight' : tplKey));
    const s = { t: 16, decor: Object.assign({}, ndecor), room: rm, modules: tpl.build(rm), isNew: true, title };
    MP.state.set(s);
    save(); close(); refresh();
    MP.toast(`Проект #2025-${num}: шаблон «${tpl.name}» под комнату ${rm.L}×${rm.W}. Открываю 3D…`, 'Проект создан');
    setTimeout(() => MP.go('studio.html'), 1400);
  });

  refresh();
  if (MP.hash() === '#new') open();
  else if (MP.hash().length > 1) { const el = document.getElementById('p-' + MP.hash().slice(1)); if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('ring-2', 'ring-primary'); } }
});
</script>
<script type="text/x-page" data-for="studio">
MP.ready(() => {
  const f = MP.fmt, ico = MP.ico, esc = MP.esc;
  let state = JSON.parse(JSON.stringify(MP.state.get()));
  const undo = [], redo = [];
  let c = MP.calc();

  const room = state.room || MP.project.room;
  let lastPlan = JSON.stringify(MP.planOf(state));
  const hint = document.getElementById('hint'), hintText = hint.textContent;
  const viewer = MP3D.create(document.getElementById('viewport'), {
    room, plan: MP.planOf(state), modules: state.modules, t: state.t, decor: state.decor, dims: true,
    onSelect: (m) => { renderInspector(); renderList(); if (m) document.getElementById('focus').disabled = false; },
    onDrag: (m, x, z) => { hint.textContent = `${m.code}: X = ${x} мм${m.type === 'island' ? ', Z = ' + z + ' мм' : ''} — отпустите, чтобы поставить`; },
    onMove: (id, x, z) => {
      hint.textContent = hintText;
      commit((s) => { const mm = s.modules.find((o) => o.id === id); mm.x = x; if (mm.type === 'island') mm.z = z; });
    }
  });

  MP.viewer = viewer; // доступ из консоли для отладки
  /* ----- Каталог, добавление, удаление ----- */
  const addFromCatalog = (code, prefX) => {
    const m = MP.placeModule(state.modules, MP.catalog.find((t) => t.code === code), room, prefX);
    if (!m) { MP.toast('В этом ряду нет свободного места нужной ширины. Сузьте или удалите соседний модуль.', 'Нет места', 'warn'); return; }
    commit((s) => s.modules.push(m));
    viewer.select(m.id);
    MP.toast(`${m.code} поставлен: X = ${m.x} мм. Детали, раскрой и смета пересчитаны.`, 'Модуль добавлен');
  };
  const removeModule = (id) => {
    const m = state.modules.find((o) => o.id === id);
    if (!m) return;
    viewer.select(null);
    commit((s) => { s.modules = s.modules.filter((o) => o.id !== id); });
    MP.toast(`${m.code} удалён. Вернуть — Ctrl+Z.`, 'Модуль удалён', 'info');
  };
  const duplicateModule = (id) => {
    const src = state.modules.find((o) => o.id === id);
    const m = MP.placeModule(state.modules, Object.assign({}, src, { id: undefined }), room, src.x + src.w * 1.5);
    if (!m) { MP.toast('Рядом нет свободного места для копии.', 'Нет места', 'warn'); return; }
    commit((s) => s.modules.push(m));
    viewer.select(m.id);
  };
  const CAT_ICON = { base: 'table_rows', oven: 'oven', appliance: 'kitchen', tall: 'door_front', upper: 'shelves', island: 'countertops' };
  function renderCatalog() {
    const groups = [...new Set(MP.catalog.map((t) => t.group))];
    document.getElementById('side-catalog').innerHTML = '<p class="font-label-sm text-label-sm text-on-surface-variant">Нажмите «+» или перетащите карточку в 3D-окно — модуль встанет на свободное место и прилипнет к соседу.</p>' +
      groups.map((g) => `<div class="flex flex-col gap-1"><span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-semibold">${g}</span>${MP.catalog.filter((t) => t.group === g).map((t) => `
        <div draggable="true" data-cat="${t.code}" class="p-2 rounded-lg bg-surface-container-low hover:bg-surface-container flex items-center gap-2 cursor-grab active:cursor-grabbing">
          <div class="w-8 h-8 rounded bg-surface-container text-primary flex items-center justify-center shrink-0">${ico(CAT_ICON[t.type])}</div>
          <div class="flex flex-col min-w-0 flex-1"><span class="font-body-sm font-semibold truncate">${esc(t.code)} • ${esc(t.name)}</span><span class="font-label-sm text-label-sm text-on-surface-variant font-mono">${t.w}×${t.h}×${t.d}</span></div>
          <button type="button" data-add="${t.code}" title="Добавить в проект" class="w-8 h-8 rounded-lg bg-primary text-on-primary hover:bg-primary-container flex items-center justify-center shrink-0">${ico('add')}</button></div>`).join('')}</div>`).join('');
  }
  const sideCat = document.getElementById('side-catalog');
  sideCat.addEventListener('click', (e) => { const b = e.target.closest('[data-add]'); if (b) addFromCatalog(b.dataset.add); });
  sideCat.addEventListener('dragstart', (e) => { const c2 = e.target.closest('[data-cat]'); if (c2) { e.dataTransfer.setData('text/plain', c2.dataset.cat); e.dataTransfer.effectAllowed = 'copy'; } });
  const vp = document.getElementById('viewport');
  vp.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; vp.classList.add('ring-4', 'ring-primary/50'); });
  vp.addEventListener('dragleave', () => vp.classList.remove('ring-4', 'ring-primary/50'));
  vp.addEventListener('drop', (e) => {
    e.preventDefault(); vp.classList.remove('ring-4', 'ring-primary/50');
    const code = e.dataTransfer.getData('text/plain');
    if (!MP.catalog.some((t) => t.code === code)) return;
    const p = viewer.floorPoint(e);
    addFromCatalog(code, p ? Math.round(p.x) : null);
  });
  let side = 'catalog';
  const setSide = (k) => {
    side = k;
    document.getElementById('side-catalog').classList.toggle('hidden', k !== 'catalog');
    const sp = document.getElementById('side-project'); sp.classList.toggle('hidden', k !== 'project'); sp.classList.toggle('flex', k === 'project');
    document.querySelectorAll('[data-side]').forEach((b) => b.className = 'flex-1 px-2 py-1.5 rounded-md font-label-md text-label-md flex items-center justify-center gap-1 ' + (b.dataset.side === k ? 'bg-surface-container-lowest text-primary font-semibold shadow-sm' : 'text-on-surface-variant hover:text-on-surface'));
  };
  document.getElementById('side-tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-side]'); if (b) setSide(b.dataset.side); });
  const mv = document.getElementById('move');
  mv.onclick = () => { const on = viewer.setMoveMode(!viewer.moveMode); setTgl(mv, on); MP.toast(on ? 'Тяните шкаф мышью вдоль стены — он прилипает к соседям и стенам. Пустое место — вращение камеры.' : 'Режим перемещения выключен.', on ? 'Перемещение' : '', 'info'); };
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input,select,textarea')) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && viewer.selected && document.getElementById('room-modal').classList.contains('hidden')) { e.preventDefault(); removeModule(viewer.selected); }
    if (e.key === 'Escape') viewer.select(null);
  });

  /* ----- Редактор комнаты ----- */
  const roomModal = document.getElementById('room-modal'), rsvg = document.getElementById('room-svg');
  let draft = null, rsel = null, rdrag = null;
  const rnd10 = (v) => Math.round(v / 10) * 10;
  const clampV = (v, a, b) => Math.max(a, Math.min(b, v));
  const openRoom = () => { draft = { room: Object.assign({}, room), plan: JSON.parse(JSON.stringify(MP.planOf(state))) }; rsel = null; roomModal.classList.remove('hidden'); renderRoom(); };
  const closeRoom = () => { roomModal.classList.add('hidden'); draft = null; };
  document.getElementById('room-btn').onclick = openRoom;
  roomModal.addEventListener('click', (e) => { if (e.target === roomModal || e.target.closest('[data-close-room]')) closeRoom(); });
  function renderRoomSummary() {
    const P = MP.planOf(state), U = MP.utilitiesFor(room, P);
    document.getElementById('room-summary').innerHTML = `<div class="flex items-center justify-between mb-2"><span class="flex items-center gap-2 font-headline-sm text-body-lg font-semibold"><span class="material-symbols-outlined text-[20px] text-tertiary">foundation</span>Комната</span><button type="button" id="room-btn2" class="px-2.5 py-1 rounded-lg bg-secondary-container text-on-secondary-container font-label-sm text-label-sm font-semibold">Изменить</button></div>
      <ul class="space-y-1 font-label-sm text-label-sm text-on-surface-variant">
        <li class="flex items-center gap-1">${ico('straighten', 'text-[14px] text-primary')}${room.L} × ${room.W} × ${room.H} мм</li>
        ${P.openings.map((o) => `<li class="flex items-center gap-1">${ico(o.kind === 'door' ? 'door_open' : 'window', 'text-[14px] ' + (o.kind === 'door' ? 'text-tertiary' : 'text-primary'))}${o.kind === 'door' ? 'Дверь' : 'Окно'} ${o.width}×${o.height} на стене ${MP.wallRu[o.wall]}, отступ ${o.offset}</li>`).join('')}
        ${(P.boxes || []).map((b) => `<li class="flex items-center gap-1">${ico('view_column', 'text-[14px]')}Короб ${b.w}×${b.d} (X ${b.x}, Z ${b.z})</li>`).join('')}
        <li class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-[#0284c7]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#ef4444]"></span>Вода: X ${P.util.waterX} мм, h=500</li>
        <li class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-white border border-outline"></span>Розетки: ${U.sockets.map((s) => s.x).join(', ')} мм, h=${P.util.socketY}</li>
        <li class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-[#eab308]"></span>Газовый стояк: X ${U.gas.x} мм</li>
      </ul>`;
    document.getElementById('room-btn2').onclick = openRoom;
  }
  function renderRoom() {
    const R = draft.room, P = draft.plan, U = MP.utilitiesFor(R, P);
    const ui = (key) => (rsel === key ? '#ba1a1a' : null);
    let s = `<rect x="0" y="0" width="${R.L}" height="${R.W}" fill="#ffffff" stroke="#131b2e" stroke-width="30"/>`;
    s += `<text x="${R.L / 2}" y="-70" font-size="60" text-anchor="middle" fill="#3f4850" font-family="JetBrains Mono">Стена А (рабочая) — ${R.L}</text><text transform="translate(-70,${R.W / 2}) rotate(-90)" font-size="60" text-anchor="middle" fill="#3f4850" font-family="JetBrains Mono">Стена Б — ${R.W}</text><text transform="translate(${R.L + 70},${R.W / 2}) rotate(90)" font-size="60" text-anchor="middle" fill="#3f4850" font-family="JetBrains Mono">Стена В</text><text x="${R.L / 2}" y="${R.W + 110}" font-size="60" text-anchor="middle" fill="#3f4850" font-family="JetBrains Mono">Стена Г</text>`;
    state.modules.filter((m) => m.type !== 'upper').forEach((m) => { s += `<rect x="${m.x}" y="${m.z}" width="${m.w}" height="${m.d}" fill="#eaedff" stroke="#bfc7d2" stroke-width="5" pointer-events="none"/><text x="${m.x + m.w / 2}" y="${m.z + m.d / 2 + 16}" font-size="44" text-anchor="middle" fill="#707881" font-family="JetBrains Mono" pointer-events="none">${esc(m.code)}</text>`; });
    s += MP.planOpeningsSVG(P, R, rsel);
    s += `<g data-obj="u:water" style="cursor:grab"><circle cx="${U.water[0].x}" cy="70" r="46" fill="#0284c7" stroke="${ui('u:water') || '#fff'}" stroke-width="10"/><circle cx="${U.water[1].x}" cy="70" r="46" fill="#ef4444" stroke="${ui('u:water') || '#fff'}" stroke-width="10"/></g>`;
    U.sockets.forEach((so, i) => { s += `<rect data-obj="u:s${i}" x="${so.x - 40}" y="150" width="80" height="80" rx="10" fill="#fff" stroke="${ui('u:s' + i) || '#131b2e'}" stroke-width="10" style="cursor:grab"/>`; });
    s += `<circle data-obj="u:gas" cx="${U.gas.x}" cy="70" r="42" fill="#eab308" stroke="${ui('u:gas') || '#fff'}" stroke-width="10" style="cursor:grab"/>`;
    rsvg.setAttribute('viewBox', `-260 -200 ${R.L + 520} ${R.W + 400}`);
    rsvg.innerHTML = s;
    renderRoomProps();
  }
  const numIn = (k, label, val, min, max) => `<label class="flex flex-col"><span class="font-label-sm text-label-sm text-on-surface-variant">${label}</span><input data-rp="${k}" type="number" min="${min}" max="${max}" step="10" value="${val}" class="px-2 py-1.5 rounded-lg bg-surface-container-low font-mono text-right outline-none focus:ring-2 focus:ring-primary"></label>`;
  function selObj() {
    if (!rsel) return null;
    const [t, id] = rsel.split(':'), P = draft.plan;
    if (t === 'o') return { t, o: P.openings.find((x) => x.id === id) };
    if (t === 'b') return { t, o: (P.boxes || []).find((x) => x.id === id) };
    return { t, id };
  }
  function renderRoomProps() {
    const R = draft.room, P = draft.plan, so = selObj();
    let h = `<div class="p-3 rounded-xl bg-surface-container-low flex flex-col gap-2"><span class="font-label-md text-label-md font-bold">Размеры комнаты, мм</span><div class="grid grid-cols-3 gap-2">${numIn('room.L', 'Длина (стена А)', R.L, 1500, 12000)}${numIn('room.W', 'Ширина (стена Б)', R.W, 1500, 12000)}${numIn('room.H', 'Высота', R.H, 2200, 4000)}</div></div>`;
    if (!so || (so.t !== 'u' && !so.o)) h += `<div class="p-3 rounded-xl bg-surface-container-low font-body-sm text-body-sm text-on-surface-variant">Нажмите на окно, дверь, короб, воду, розетку или газ на плане, чтобы изменить размеры. Тяните мышью, чтобы передвинуть.</div>`;
    else if (so.t === 'o') {
      const o = so.o;
      h += `<div class="p-3 rounded-xl bg-primary-fixed/40 flex flex-col gap-2"><div class="flex items-center justify-between"><b class="font-label-md text-label-md">${o.kind === 'door' ? 'Дверь' : 'Окно'}</b><button type="button" data-rdel class="px-2 py-1 rounded bg-error-container text-on-error-container text-label-sm font-label-sm">Удалить</button></div>
        <label class="flex flex-col"><span class="font-label-sm text-label-sm text-on-surface-variant">Стена</span><select data-rp="wall" class="px-2 py-1.5 rounded-lg bg-surface-container-lowest outline-none">${Object.keys(MP.wallNames).map((k) => `<option value="${k}" ${k === o.wall ? 'selected' : ''}>${MP.wallNames[k]}</option>`).join('')}</select></label>
        <div class="grid grid-cols-2 gap-2">${numIn('offset', 'Отступ от угла', o.offset, 0, MP.wallLen(R, o.wall))}${numIn('width', 'Ширина', o.width, 300, 3000)}${numIn('height', 'Высота', o.height, 300, R.H)}${o.kind === 'window' ? numIn('sill', 'Подоконник от пола', o.sill, 0, 2000) : ''}</div>
        <span class="font-label-sm text-label-sm text-on-surface-variant">${o.kind === 'door' ? 'Зона распахивания = ширина полотна; мебель в ней — ошибка.' : 'Мебель выше подоконника перед окном — ошибка. Подоконник от 860 мм пропускает столешницу.'}</span></div>`;
    } else if (so.t === 'b') {
      const b = so.o;
      h += `<div class="p-3 rounded-xl bg-surface-container-high/60 flex flex-col gap-2"><div class="flex items-center justify-between"><b class="font-label-md text-label-md">Короб / колонна</b><button type="button" data-rdel class="px-2 py-1 rounded bg-error-container text-on-error-container text-label-sm font-label-sm">Удалить</button></div>
        <div class="grid grid-cols-2 gap-2">${numIn('x', 'X от стены Б', b.x, 0, R.L)}${numIn('z', 'Z от стены А', b.z, 0, R.W)}${numIn('w', 'Ширина', b.w, 50, 3000)}${numIn('d', 'Глубина', b.d, 50, 3000)}${numIn('h', 'Высота', b.h || R.H, 100, R.H)}</div></div>`;
    } else {
      const id = so.id, u = P.util;
      if (id === 'water') h += `<div class="p-3 rounded-xl bg-surface-container-low flex flex-col gap-2"><b class="font-label-md text-label-md">Вывод воды и канализации</b>${numIn('waterX', 'Центр, X от стены Б', u.waterX, 100, R.L - 100)}<span class="font-label-sm text-label-sm text-on-surface-variant">Шаблон «Прямая кухня» ставит мойку над выводом воды.</span></div>`;
      else if (id === 'gas') h += `<div class="p-3 rounded-xl bg-surface-container-low flex flex-col gap-2"><b class="font-label-md text-label-md">Газовый стояк</b>${numIn('gasX', 'X от стены Б', MP.utilitiesFor(R, P).gas.x, 20, R.L - 20)}<button type="button" data-rgasauto class="self-start px-2 py-1 rounded bg-surface-container-high text-label-sm font-label-sm">В правый угол</button></div>`;
      else { const i = +id.slice(1); h += `<div class="p-3 rounded-xl bg-surface-container-low flex flex-col gap-2"><div class="flex items-center justify-between"><b class="font-label-md text-label-md">Розетка ${i + 1}</b><button type="button" data-rdel class="px-2 py-1 rounded bg-error-container text-on-error-container text-label-sm font-label-sm">Удалить</button></div><div class="grid grid-cols-2 gap-2">${numIn('sockX', 'X от стены Б', u.sockets[i], 40, R.L - 40)}${numIn('socketY', 'Высота (все)', u.socketY, 200, 2000)}</div></div>`; }
    }
    // Проверки с черновиком комнаты
    const cc = MP.calc(Object.assign({}, state, { room: R, plan: P }), {});
    const bad = cc.checks.filter((k) => k.status !== 'ok');
    h += `<div class="p-3 rounded-xl ${bad.length ? 'bg-error-container/50' : 'bg-secondary-container/40'} flex flex-col gap-1"><b class="font-label-md text-label-md">${bad.length ? 'Замечания к расстановке' : 'Мебель помещается'}</b>${bad.length ? bad.map((k) => `<span class="font-body-sm text-body-sm">• ${esc(k.title)}: ${esc(k.text)}</span>`).join('') : '<span class="font-body-sm text-body-sm">Окна, двери, короба и коммуникации не мешают модулям.</span>'}</div>`;
    document.getElementById('room-props').innerHTML = h;
    document.getElementById('room-status').textContent = `Окон и дверей: ${P.openings.length} • коробов: ${(P.boxes || []).length} • розеток: ${P.util.sockets.length}`;
  }
  const roomProps = document.getElementById('room-props');
  roomProps.addEventListener('change', (e) => {
    const inp = e.target.closest('[data-rp]'); if (!inp || !draft) return;
    const k = inp.dataset.rp, v = inp.tagName === 'SELECT' ? inp.value : Math.round(+inp.value), so = selObj(), P = draft.plan;
    if (inp.tagName !== 'SELECT' && (!Number.isFinite(v) || v < +inp.min || v > +inp.max)) { MP.toast(`Допустимо ${inp.min}–${inp.max} мм.`, 'Неверное значение', 'warn'); renderRoomProps(); return; }
    if (k.startsWith('room.')) draft.room[k.slice(5)] = v;
    else if (k === 'waterX') P.util.waterX = v;
    else if (k === 'gasX') P.util.gasX = v;
    else if (k === 'socketY') P.util.socketY = v;
    else if (k === 'sockX') P.util.sockets[+so.id.slice(1)] = v;
    else if (so && so.o) { so.o[k] = v; if (k === 'wall') so.o.offset = clampV(so.o.offset, 0, MP.wallLen(draft.room, v) - so.o.width); }
    renderRoom();
  });
  roomProps.addEventListener('click', (e) => {
    if (!draft) return;

    const iw = m.w - 2 * t, fr = MP.frontsFor(m), parts = c.parts.filter((p) => p.mid === m.id), hw = MP.hardwareFor(m);
    const num = (k, label, min, max) => `<label class="flex flex-col"><span class="font-label-sm text-label-sm text-outline font-mono">${label}</span><div class="relative"><input data-dim="${k}" type="number" min="${min}" max="${max}" step="10" value="${m[k]}" class="w-full text-right pr-7 pl-1.5 py-1 bg-surface-container-low rounded font-mono text-body-sm font-semibold outline-none focus:ring-1 focus:ring-primary"><span class="absolute right-1.5 top-1 font-mono text-label-sm text-outline">мм</span></div></label>`;
    const body = m.type === 'appliance' ? '<div class="p-1.5 rounded bg-surface-container-lowest text-[11px]">Встраиваемая техника: корпуса нет, только фасад.</div>' :
      `<div class="p-1.5 rounded bg-surface-container-lowest"><div class="flex justify-between font-semibold"><span>• Боковины (2 шт):</span><span class="text-primary">${m.h} × ${m.d}</span></div><div class="text-[10px] text-on-surface-variant">Высота корпуса = ${m.h} мм (без цоколя ${MP.settings.plinth} и столешницы ${MP.settings.topT})</div></div>
       <div class="p-1.5 rounded bg-surface-container-lowest"><div class="flex justify-between font-semibold"><span>• Дно${m.type === 'upper' || m.type === 'tall' ? ' и крыша' : ''}:</span><span class="text-primary">${iw} × ${m.d}</span></div><div class="text-[10px] text-on-surface-variant">${m.w} − 2 × ${t} = ${iw} мм</div>
       ${['base', 'oven', 'island'].includes(m.type) ? `<div class="flex justify-between font-semibold pt-1 mt-1 border-t border-surface-container-high"><span>• Царги (2 шт):</span><span class="text-primary">${iw} × 80</span></div>` : ''}</div>
       <div class="p-1.5 rounded bg-surface-container-lowest flex justify-between"><span>Внутренний проём:</span><b>${iw} × ${m.h - 2 * t} × ${m.d}</b></div>`;
    el.innerHTML = `<div class="flex items-start justify-between gap-2"><div class="min-w-0"><span class="font-label-sm text-label-sm text-primary font-mono">Инспектор • ${MP.typeNames[m.type]}</span><h2 class="font-headline-sm text-body-lg font-bold truncate">${esc(m.code)}</h2><span class="font-body-sm text-body-sm text-on-surface-variant">${esc(m.name)} • ${esc(m.place)}</span></div>
        <button type="button" id="desel" title="Снять выделение" class="p-1 rounded hover:bg-surface-container">${ico('close')}</button></div>
      <div class="flex items-center justify-between"><span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Габариты (мм):</span>${thick}</div>
      <div class="grid grid-cols-3 gap-2">${num('w', 'Ширина', 150, 1200)}${num('h', 'Высота', 100, 2400)}${num('d', 'Глубина', 200, 700)}</div>
      <div class="grid grid-cols-2 gap-2">${num('x', 'X от стены Б', 0, room.L)}${num('z', m.type === 'island' ? 'Z от стены А' : 'Z (отступ)', 0, room.W)}</div>
      ${fr.length ? `<div class="flex flex-col gap-1 p-2 rounded-lg bg-surface-container-low"><div class="flex items-baseline justify-between gap-2"><span class="font-label-sm text-label-sm font-semibold">Цвет фасадов модуля</span><span class="font-label-sm text-label-sm text-on-surface-variant truncate">${m.facade ? esc(MP.decor('facade', m.facade).name) : 'как в проекте'}</span></div>
        <div class="flex flex-wrap items-center gap-1.5"><button type="button" data-mfacade="" class="px-2 h-8 rounded-full text-label-sm font-label-sm ${m.facade ? 'bg-surface-container-high hover:bg-surface-variant' : 'bg-primary text-on-primary'}">Как в проекте</button>${MP.decors.facade.map((d) => swatch(d, m.facade === d.key, `data-mfacade="${d.key}"`)).join('')}</div></div>` : ''}
      ${fillUI(m)}
      <div class="grid grid-cols-4 gap-1.5">
        <button type="button" data-push="-1" title="Прижать к соседу слева" class="py-1 rounded bg-surface-container hover:bg-surface-container-high text-label-sm font-label-sm flex items-center justify-center">${ico('keyboard_double_arrow_left', 'text-[16px]')}</button>
        <button type="button" data-push="1" title="Прижать к соседу справа" class="py-1 rounded bg-surface-container hover:bg-surface-container-high text-label-sm font-label-sm flex items-center justify-center">${ico('keyboard_double_arrow_right', 'text-[16px]')}</button>
        <button type="button" id="dup" title="Копия рядом" class="py-1 rounded bg-surface-container hover:bg-surface-container-high text-label-sm font-label-sm flex items-center justify-center">${ico('content_copy', 'text-[16px]')}</button>
        <button type="button" id="del" title="Удалить модуль (Delete)" class="py-1 rounded bg-error-container text-on-error-container hover:opacity-80 text-label-sm font-label-sm flex items-center justify-center">${ico('delete', 'text-[16px]')}</button></div>
      <div class="grid grid-cols-3 gap-1.5">
        <button type="button" id="open" class="py-1 rounded bg-surface-container hover:bg-surface-container-high text-label-sm font-label-sm flex items-center justify-center gap-1">${ico('door_open', 'text-[16px]')}Фасады</button>
        <button type="button" id="focus2" class="py-1 rounded bg-surface-container hover:bg-surface-container-high text-label-sm font-label-sm flex items-center justify-center gap-1">${ico('center_focus_strong', 'text-[16px]')}Камера</button>
        <button type="button" id="reset-m" ${MP.defaultModules.some((d) => d.id === m.id) ? '' : 'disabled title="Новый модуль — сбрасывать нечего"'} class="py-1 rounded bg-surface-container hover:bg-surface-container-high text-label-sm font-label-sm flex items-center justify-center gap-1 text-tertiary disabled:opacity-40">${ico('restart_alt', 'text-[16px]')}Сброс</button></div>
      <div class="flex flex-col gap-1.5 p-2 rounded-lg bg-surface-container-low border border-outline-variant/30 text-[11px] font-mono">
        <span class="font-label-sm text-label-sm font-bold flex items-center gap-1">${ico('architecture', 'text-[16px] text-primary')}Формулы деталей</span>${body}
        ${fr.map((x) => `<div class="p-1.5 rounded bg-surface-container-lowest flex justify-between"><span>• ${{ door: 'Дверь', drawer: 'Ящик', lift: 'Подъёмный', appl: 'Фасад ПММ', panel: 'Глухая панель' }[x.kind]}:</span><span class="text-primary">${x.h} × ${x.w} × 18</span></div>`).join('')}
        ${fr.length ? '<div class="text-[10px] text-secondary">Зазор 2 мм по периметру каждого фасада</div>' : ''}</div>
      <div class="flex flex-col gap-1"><span class="font-label-sm text-label-sm font-bold">Детали модуля в спецификации</span>
        <div class="max-h-40 overflow-y-auto text-[11px] font-mono divide-y divide-surface-container">${parts.map((p) => `<div class="flex justify-between py-1"><span><b class="text-primary">#${String(p.pos).padStart(2, '0')}</b> ${esc(p.name)} ×${p.qty}</span><span>${p.L}×${p.W}</span></div>`).join('')}</div></div>
      <div class="flex flex-col gap-1"><span class="font-label-sm text-label-sm font-bold flex items-center gap-1">${ico('build_circle', 'text-[16px] text-secondary')}Фурнитура модуля</span>
        <div class="text-[11px] font-mono space-y-0.5">${Object.keys(hw).map((k) => `<div class="flex justify-between"><span>${MP.hardwareCatalog[k].name}</span><b>${hw[k]} ${MP.hardwareCatalog[k].unit}</b></div>`).join('') || '—'}</div></div>`;
    const apply = (inp) => {
      const k = inp.dataset.dim, v = Math.round(+inp.value), min = +inp.min, max = +inp.max;
      if (!Number.isFinite(v) || v < min || v > max) { inp.value = m[k]; MP.toast(`Допустимо ${min}–${max} мм.`, 'Неверный размер', 'warn'); return; }
      if (v === m[k]) return;
      commit((s) => { s.modules.find((x) => x.id === m.id)[k] = v; });
    };
    el.querySelectorAll('[data-dim]').forEach((inp) => { inp.addEventListener('change', () => apply(inp)); inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); }); });
    el.querySelector('#desel').onclick = () => viewer.select(null);
    el.querySelectorAll('[data-mfacade]').forEach((b) => (b.onclick = () => {
      const key = b.dataset.mfacade || undefined;
      if ((m.facade || undefined) === key) return;
      commit((s) => { s.modules.find((x) => x.id === m.id).facade = key; });
    }));
    el.querySelector('#open').onclick = () => viewer.toggleOpen(m.id);
    el.querySelector('#focus2').onclick = () => viewer.focusSelected();
    el.querySelector('#reset-m').onclick = () => { const o = MP.defaultModules.find((d) => d.id === m.id); if (o) commit((s) => Object.assign(s.modules.find((x) => x.id === m.id), { w: o.w, h: o.h, d: o.d, x: o.x, y: o.y, z: o.z, facade: undefined, shelves: o.shelves, fill: o.fill })); };
    el.querySelector('#del').onclick = () => removeModule(m.id);
    el.querySelector('#dup').onclick = () => duplicateModule(m.id);
    el.querySelectorAll('[data-push]').forEach((b) => (b.onclick = () => {
      const x = MP.pushX(state.modules, m, room, +b.dataset.push);
      if (x !== m.x) commit((s) => { s.modules.find((o) => o.id === m.id).x = x; });
    }));
    el.querySelectorAll('[data-fill]').forEach((b) => (b.onclick = () => {
      const [k, v] = b.dataset.fill.split(':');
      commit((s) => {
        const mm = s.modules.find((o) => o.id === m.id);
        mm.fill = Object.assign({}, mm.fill);
        if (k === 'shelves') mm.shelves = Math.max(0, Math.min(6, (mm.shelves || 0) + +v));
        else if (k === 'inner') mm.fill.inner = Math.max(0, Math.min(3, (mm.fill.inner || 0) + +v));
        else mm.fill[k] = !mm.fill[k];
      });
    }));
  }
  // Наполнение шкафа: полки, внутренние ящики, штанга, сушка
  function fillUI(m) {
    if (m.type === 'appliance' || m.type === 'oven' || m.front === 'drawers3' || m.front === 'lift') return '';
    const fl = m.fill || {}, doors = m.front === 'doors' || m.front === 'corner' || m.front === 'tall';
    const step = (k, label, val, max) => `<div class="flex items-center justify-between gap-2"><span class="font-label-sm text-label-sm">${label}</span><div class="flex items-center gap-1"><button type="button" data-fill="${k}:-1" ${val <= 0 ? 'disabled' : ''} class="w-7 h-7 rounded bg-surface-container-high disabled:opacity-40">−</button><b class="w-6 text-center font-mono">${val}</b><button type="button" data-fill="${k}:1" ${val >= max ? 'disabled' : ''} class="w-7 h-7 rounded bg-surface-container-high disabled:opacity-40">+</button></div></div>`;
    const tog = (k, label, on) => `<button type="button" data-fill="${k}:t" class="px-2.5 py-1 rounded-full text-label-sm font-label-sm ${on ? 'bg-secondary text-on-secondary' : 'bg-surface-container-high hover:bg-surface-variant'}">${on ? '✓ ' : ''}${label}</button>`;
    return `<div class="flex flex-col gap-1.5 p-2 rounded-lg bg-surface-container-low"><span class="font-label-sm text-label-sm font-bold flex items-center gap-1">${ico('shelves', 'text-[16px] text-primary')}Наполнение</span>
      ${step('shelves', 'Полки', m.shelves || 0, 6)}
      ${doors && m.type !== 'upper' ? step('inner', 'Внутренние ящики', fl.inner || 0, 3) : ''}
      <div class="flex flex-wrap gap-1.5">${m.type === 'tall' ? tog('rod', 'Штанга для одежды', fl.rod) : ''}${m.type === 'upper' && doors ? tog('dryer', 'Сушка для посуды', fl.dryer) : ''}</div></div>`;
  }
  document.getElementById('inspector').addEventListener('click', (e) => { const b = e.target.closest('[data-thick]'); if (b && +b.dataset.thick !== state.t) commit((s) => (s.t = +b.dataset.thick)); });

  function renderChecks() {
    const ok = c.checks.filter((k) => k.status === 'ok').length, err = c.checks.some((k) => k.status === 'error');
    const pc = document.getElementById('pf-count');
    pc.textContent = `${ok}/${c.checks.length} пройдено`;
    pc.className = 'px-2 py-0.5 rounded-full font-mono text-[11px] font-bold ' + (err ? 'bg-error-container text-on-error-container' : ok === c.checks.length ? 'bg-secondary-container text-on-secondary-container' : 'bg-tertiary-fixed text-on-tertiary-fixed');
    document.getElementById('checks').innerHTML = c.checks.map((k) => `<div class="p-2.5 rounded-lg bg-surface-container-low flex flex-col gap-1 border-l-2 border-${statusTone[k.status]}">
      <div class="flex items-center justify-between gap-2"><span class="font-label-sm text-label-sm font-semibold flex items-center gap-1">${ico(k.status === 'ok' ? 'check_circle' : k.status === 'warn' ? 'warning' : 'error', 'text-[16px] text-' + statusTone[k.status])}${k.title}</span><span class="text-[10px] font-mono px-1.5 rounded bg-surface-container-high text-${statusTone[k.status]} font-bold">${{ ok: 'В норме', warn: 'Внимание', error: 'Ошибка' }[k.status]}</span></div>
      <span class="font-body-sm text-[12px] text-on-surface-variant">${esc(k.text)}</span></div>`).join('');
  }

  function renderSpec() {
    document.getElementById('spec').innerHTML = state.modules.map((m, i) => `<div class="p-2 rounded-lg bg-surface-container-low flex flex-col gap-0.5 ${m.id === viewer.selected ? 'border-l-2 border-primary' : ''}">
      <div class="flex items-center justify-between gap-1"><button type="button" data-mod="${m.id}" class="font-mono text-label-sm font-bold text-left hover:text-primary truncate">${esc(m.code)}</button><input type="checkbox" data-vis="${m.id}" ${viewer.hidden.has(m.id) ? '' : 'checked'} class="w-3.5 h-3.5 accent-[#006194]" title="Показывать в 3D"></div>
      <span class="font-label-sm text-label-sm text-on-surface-variant font-mono">${m.w}×${m.h}×${m.d}</span><span class="font-label-sm text-label-sm text-secondary">Поз. ${String(i + 1).padStart(2, '0')} • ${esc(m.place)}</span></div>`).join('');
    const mt = (icon, tone, a, b) => `<div class="flex items-center gap-3"><div class="w-8 h-8 rounded bg-surface-container-lowest flex items-center justify-center text-${tone} shadow-xs">${ico(icon)}</div><div class="flex flex-col"><span class="font-label-sm text-label-sm text-on-surface-variant">${a}</span><span class="font-mono text-body-md font-bold">${b}</span></div></div>`;
    document.getElementById('materials').innerHTML = `<div class="flex items-center gap-6 flex-wrap">${mt('layers', 'primary', c.mats.ldsp.short, c.sheets.ldsp + ' ' + MP.plural(c.sheets.ldsp, 'лист', 'листа', 'листов') + ' <small class="font-normal text-outline">(' + MP.pct(c.util.ldsp, 0) + ')</small>')}${mt('dashboard', 'secondary', 'МДФ 18 мм (' + c.matKeys.filter((k) => k.startsWith('mdf-')).length + ' цв.)', c.sheets.mdf + ' ' + MP.plural(c.sheets.mdf, 'лист', 'листа', 'листов'))}${mt('crop_portrait', 'outline', MP.materials.hdf.short, c.sheets.hdf + ' ' + MP.plural(c.sheets.hdf, 'лист', 'листа', 'листов'))}${mt('straighten', 'tertiary', 'Столешницы 38 мм', c.tops.map((t) => t.len + '×' + t.depth).join(' + '))}</div>
      <span class="font-mono text-label-md font-bold text-secondary bg-secondary-container/50 px-2 py-0.5 rounded">Кромка: ${f(c.edgeTotal, 1)} пог. м</span>`;
  }
  document.getElementById('spec').addEventListener('click', (e) => { const b = e.target.closest('[data-mod]'); if (b) viewer.select(b.dataset.mod); });
  document.getElementById('spec').addEventListener('change', (e) => { const cb = e.target.closest('[data-vis]'); if (cb) viewer.setHidden(cb.dataset.vis, !cb.checked); });

  /* ----- Цвета ----- */
  function renderDecor() {
    const kinds = [['facade', 'Фасады', 'МДФ 18 мм, цена за лист'], ['carcass', 'Корпус', 'ЛДСП 16 мм, цена за лист'], ['top', 'Столешница', 'Egger 38 мм, доплата за полотно']];
    document.getElementById('decor-panel').innerHTML = `<span class="flex items-center gap-2 font-headline-sm text-body-lg font-semibold"><span class="material-symbols-outlined text-[20px] text-secondary">palette</span>Цвета проекта</span>` +
      kinds.map(([k, label, hint]) => {
        const cur = MP.decor(k, state.decor[k]);
        return `<div class="flex flex-col gap-1"><div class="flex items-baseline justify-between gap-2"><span class="font-label-sm text-label-sm font-semibold">${label}</span><span class="font-label-sm text-label-sm text-on-surface-variant truncate">${esc(cur.name)}</span></div>
          <div class="flex flex-wrap gap-1.5">${MP.decors[k].map((d) => swatch(d, d.key === cur.key, `data-decor="${k}" data-key="${d.key}"`, k === 'top' ? (d.price ? '+' + f(d.price) : 'базовая') : f(d.price))).join('')}</div>
          <span class="text-[10px] font-mono text-outline">${hint}</span></div>`;
      }).join('');
  }
  document.getElementById('decor-panel').addEventListener('click', (e) => {
    const b = e.target.closest('[data-decor]');
    if (!b || state.decor[b.dataset.decor] === b.dataset.key) return;
    commit((s) => { s.decor = Object.assign({}, s.decor, { [b.dataset.decor]: b.dataset.key }); });
    MP.toast(`${MP.decorLabels[b.dataset.decor]}: ${MP.decor(b.dataset.decor, b.dataset.key).name}. Раскрой и смета пересчитаны.`, 'Цвет изменён');
  });

  function renderAll() {
    document.getElementById('undo').disabled = !undo.length; document.getElementById('redo').disabled = !redo.length;
    renderDecor(); renderRoomSummary(); renderStrip(); renderList(); renderInspector(); renderChecks(); renderSpec();
  }
  renderCatalog();
  setSide('catalog');
  renderAll();
  if (state.modules.some((m) => m.id === 'm10')) viewer.select('m10');
});
</script>
<script type="text/x-page" data-for="cutting">
MP.ready(() => {
  const f = MP.fmt, ico = MP.ico, esc = MP.esc;
  const st = MP.state.get();
  let opts = { kerf: MP.settings.kerf, trim: MP.settings.trim };
  let c = MP.calc(st, opts), mat = 'ldsp', sheetN = 1, selected = null, filter = 'all', docTab = 'quote';
  const params = document.getElementById('params');
  params.kerf.value = opts.kerf; params.trim.value = opts.trim;
  const sync = document.getElementById('sync');
  sync.innerHTML = c.modified ? `<span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span><span class="text-tertiary">Расчёт по изменённому проекту (черновик v1.3)</span>` : `<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span><span class="text-secondary">Синхронизировано с 3D-проектом v1.2</span>`;
  const edgeLabel = (e) => e === '2.0' ? '<span class="text-secondary font-semibold">2.0</span>' : e === 'PUR' ? '<span class="text-primary font-semibold">PUR</span>' : e ? '<span class="text-on-surface-variant">0.4</span>' : '—';
  const partByPos = (pos) => c.parts.find((p) => p.pos === pos);

  /* ----- Карточки материалов ----- */
  function renderMats() {
    const cards = c.matKeys.map((k) => {
      const m = c.mats[k], rem = c.layouts[k].reduce((s, sh) => s + (sh.remnant && sh.remnant.w >= 300 ? sh.remnant.w * sh.remnant.h / 1e6 : 0), 0);
      return `<button type="button" data-mat="${k}" class="text-left p-3 rounded-xl border ${k === mat ? 'border-primary ring-1 ring-primary bg-primary-fixed/20' : 'border-surface-container-high bg-surface-container-low hover:bg-surface-container'} flex flex-col justify-between">
        <div class="space-y-1"><div class="flex items-center justify-between"><span class="px-2 py-0.5 rounded bg-surface-container-high font-label-sm text-label-sm font-bold">${m.role}</span><span class="font-label-sm text-label-sm text-secondary font-bold">Исп. ${MP.pct(c.util[k])}</span></div>
          <h3 class="font-body-md font-bold leading-tight">${m.name}</h3><p class="font-label-sm text-label-sm text-on-surface-variant">Лист ${m.L} × ${m.W} мм • ${f(m.price)} сом/лист</p>
          <div class="pt-1 space-y-0.5 text-label-sm font-label-sm"><div class="flex justify-between"><span class="text-on-surface-variant">Листов:</span><b class="font-mono text-primary">${c.sheets[k]}</b></div><div class="flex justify-between"><span class="text-on-surface-variant">Площадь деталей:</span><span class="font-mono">${f(c.area[k], 2)} м²</span></div><div class="flex justify-between"><span class="text-on-surface-variant">Деталей:</span><span class="font-mono">${c.parts.filter((p) => p.mat === k).reduce((s, p) => s + p.qty, 0)} шт</span></div></div></div>
        <div class="mt-2 pt-2 border-t border-surface-container-high flex justify-between text-label-sm font-label-sm"><span class="text-secondary font-semibold flex items-center gap-1">${ico('recycling', 'text-[15px]')}Обрезки: ${f(rem, 2)} м²</span><span class="text-on-surface-variant">Склад: ${m.stock} л.</span></div></button>`;
    }).join('');
    const tops = `<div class="p-3 rounded-xl border border-surface-container-high bg-surface-container-low flex flex-col justify-between"><div class="space-y-1"><div class="flex items-center justify-between"><span class="px-2 py-0.5 rounded bg-tertiary-fixed text-on-tertiary-fixed font-label-sm text-label-sm font-bold">Рабочая зона</span><span class="font-label-sm text-label-sm text-on-surface-variant">38 мм</span></div>
      <h3 class="font-body-md font-bold leading-tight">Столешницы ${MP.decor('top', c.decor.top).name}</h3>${c.tops.map((t) => `<div class="flex justify-between text-label-sm font-label-sm"><span class="text-on-surface-variant">${t.key === 'wall' ? 'Стена А' : 'Остров'}:</span><span class="font-mono">${t.len} × ${t.depth} мм (${t.qty} полотно)</span></div>`).join('')}</div>
      <div class="mt-2 pt-2 border-t border-surface-container-high text-label-sm font-label-sm text-on-surface-variant">Стыки и вырезы под мойку/варку — на ЧПУ по шаблону</div></div>`;

        <div class="bg-white rounded-lg p-2 border border-surface-container-high overflow-x-auto"><div class="min-w-[520px] max-w-3xl">${dw.plan}</div></div>
        <p class="font-label-sm text-label-sm text-on-surface-variant">Размеры в мм. Привязка — от стены Б (левый угол) и от пола. Фальш-планки подрезаются по месту.</p></div>`;
      document.getElementById('print-dw').onclick = () => printDoc('a4', `<section class="print-break">${head('Развёртка стены А')}${dw.elevation}</section><section>${head('План сверху')}<div style="max-width:70%">${dw.plan}</div></section>`);
    } else if (docTab === 'diff') {
      const base = MP.calc({ t: 16, modules: MP.defaultModules }, {}), d = MP.state.diff(st);
      const row = (n, a, b, fm) => { const delta = b - a; return [n, fm(a), fm(b), delta ? `<span class="${delta > 0 ? 'text-tertiary' : 'text-secondary'}">${delta > 0 ? '+' : ''}${fm(delta)}</span>` : '—']; };
      body.innerHTML = `<div class="p-4 rounded-xl bg-surface-container-low space-y-3"><div class="flex flex-wrap justify-between items-center gap-2"><div><h3 class="font-headline-sm text-headline-sm">Сравнение с подписанной версией v1.2</h3><p class="font-body-sm text-body-sm text-on-surface-variant">Изменения в 3D-модели и их влияние на материалы и себестоимость</p></div>
        <span class="px-2.5 py-1 rounded font-label-sm text-label-sm font-semibold ${d.length ? 'bg-tertiary-fixed text-on-tertiary-fixed' : 'bg-secondary-container text-on-secondary-container'}">${d.length ? d.length + ' изм. • нужна подпись клиента' : 'Изменений нет'}</span></div>
        ${d.length ? table(['Модуль / параметр', 'Было', 'Стало', 'Разница'], d.map((x) => [esc(x.code) + ' — ' + x.field, x.from, x.to, x.text ? '—' : (x.to - x.from > 0 ? '+' : '') + (x.to - x.from)])) : '<p class="p-3 rounded-lg bg-surface-container-lowest text-body-sm">Проект совпадает с подписанной версией. Измените размеры в 3D-конструкторе, и здесь появится сравнение.</p>'}
        ${table(['Показатель', 'v1.2', 'Сейчас', 'Разница'], [row('Листов ЛДСП', base.sheets.ldsp, c.sheets.ldsp, (v) => f(v)), row('Листов МДФ', base.sheets.mdf, c.sheets.mdf, (v) => f(v)), row('Деталей', base.pieces, c.pieces, (v) => f(v)), row('Кромка, пог. м', base.edgeTotal, c.edgeTotal, (v) => f(v, 1)), row('Себестоимость, KGS', base.cost.total, c.cost.total, (v) => f(v))])}
        <div class="flex gap-2 flex-wrap"><a href="studio.html" class="px-3 py-2 rounded-lg bg-primary text-on-primary font-label-md text-label-md inline-flex items-center gap-1">${ico('view_in_ar')}Открыть в 3D</a></div></div>`;
    }
  }
  document.getElementById('doc-tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-doc]'); if (b) { docTab = b.dataset.doc; renderDocs(); } });

  /* ----- Режимы ----- */
  const setMode = (m) => {
    document.getElementById('view-cut').classList.toggle('hidden', m !== 'cut');
    const vd = document.getElementById('view-docs'); vd.classList.toggle('hidden', m !== 'docs'); vd.classList.toggle('flex', m === 'docs');
    document.querySelectorAll('[data-mode]').forEach((b) => b.className = 'px-3 py-1.5 rounded-lg font-label-sm text-label-sm font-bold flex items-center gap-1.5 ' + (b.dataset.mode === m ? 'bg-surface-container-lowest text-primary shadow-sm' : 'text-on-surface-variant hover:text-on-surface'));
  };
  document.getElementById('mode-tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-mode]'); if (b) { setMode(b.dataset.mode); MP.setHash(b.dataset.mode === 'docs' ? '#docs' : ''); } });
  document.getElementById('to-labels').onclick = () => { docTab = 'labels'; setMode('docs'); renderDocs(); };

  params.addEventListener('submit', (e) => {
    e.preventDefault();
    const kerf = +params.kerf.value, trim = +params.trim.value;
    if (!(kerf >= 2 && kerf <= 6) || !(trim >= 0 && trim <= 40)) { MP.toast('Пропил 2–6 мм, обпил 0–40 мм.', 'Проверьте параметры', 'warn'); return; }
    const icon = document.getElementById('recalc-ico'); icon.classList.add('animate-spin');
    setTimeout(() => {
      opts = { kerf, trim }; c = MP.calc(st, opts); selected = null;
      renderAll(); icon.classList.remove('animate-spin');
      MP.toast(`ЛДСП: ${c.sheets.ldsp} л. (${MP.pct(c.util.ldsp)}), МДФ: ${c.sheets.mdf} л., ХДФ: ${c.sheets.hdf} л.`, 'Раскрой пересчитан');
    }, 350);
  });

  /* ----- Экспорт ----- */
  const csvCell = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  document.getElementById('csv').onclick = () => {
    const rows = [['Поз', 'Код', 'Деталь', 'Модуль', 'Материал', 'L', 'W', 'Кол-во', 'Кромка L1', 'Кромка L2', 'Кромка W1', 'Кромка W2', 'Паз ХДФ', 'Присадка']].concat(c.parts.map((p) => [p.pos, p.code, p.name, p.module, c.mats[p.mat].name, p.L, p.W, p.qty, p.edge.L1, p.edge.L2, p.edge.W1, p.edge.W2, p.groove ? 'да' : '', p.drill]));
    MP.download(`MP-${MP.project.id}-detali.csv`, '﻿' + rows.map((r) => r.map(csvCell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  };
  document.getElementById('dxf').onclick = () => {
    const out = ['0', 'SECTION', '2', 'ENTITIES'];
    const line = (l, x1, y1, x2, y2) => out.push('0', 'LINE', '8', l, '10', x1.toFixed(1), '20', y1.toFixed(1), '30', '0', '11', x2.toFixed(1), '21', y2.toFixed(1), '31', '0');
    const rect = (l, x, y, w, h) => { line(l, x, y, x + w, y); line(l, x + w, y, x + w, y + h); line(l, x + w, y + h, x, y + h); line(l, x, y + h, x, y); };
    const text = (x, y, h, s) => out.push('0', 'TEXT', '8', 'TEXT', '10', x.toFixed(1), '20', y.toFixed(1), '30', '0', '40', String(h), '1', s);
    let ox = 0;
    c.matKeys.forEach((k, mi) => c.layouts[k].forEach((s) => {
      const oy = -mi * (s.W + 600);
      rect('SHEET', ox, oy, s.L, s.W);
      text(ox, oy + s.W + 60, 60, `${k.toUpperCase()} SHEET ${s.n} ${s.L}x${s.W}`);
      s.parts.forEach((p) => { const y = oy + s.W - (p.y + s.trim) - p.h; rect('PARTS', ox + p.x + s.trim, y, p.w, p.h); text(ox + p.x + s.trim + 20, y + 20, 40, `#${p.ref} ${Math.round(p.rot ? p.h : p.w)}x${Math.round(p.rot ? p.w : p.h)}`); });
      ox += s.L + 400;
    }));
    out.push('0', 'ENDSEC', '0', 'EOF');
    MP.download(`MP-${MP.project.id}-raskroy.dxf`, out.join('\r\n'), 'application/dxf');
    MP.toast('DXF содержит контуры листов и деталей (слои SHEET, PARTS, TEXT). Постпроцессоры .mpr/.cix появятся позже.', 'DXF сохранён', 'info');
  };

  /* ----- Печать ----- */
  function printDoc(kind, html) {
    document.getElementById('page-size').textContent = kind === 'label' ? '@page{size:58mm 40mm;margin:0}' : '@page{size:A4 landscape;margin:10mm}';
    const pa = document.getElementById('print-area');
    pa.innerHTML = html;
    setTimeout(() => { window.print(); }, 150);
  }
  window.addEventListener('afterprint', () => { document.getElementById('print-area').innerHTML = ''; });
  const head = (t) => `<div style="font-family:Geist,sans-serif;display:flex;justify-content:space-between;border-bottom:2px solid #131b2e;padding-bottom:4px;margin-bottom:8px"><b>MebelPro KG • ${esc(MP.company.name)}</b><span>${t} • заказ №${MP.project.id} • ${esc(MP.client.name)} • ${MP.today}</span></div>`;
  function printCut() {
    let html = '';
    c.matKeys.forEach((k) => c.layouts[k].forEach((s) => {
      const ids = [...new Set(s.parts.map((p) => p.ref))];
      html += `<section class="print-break">${head(`${c.mats[k].name}, лист ${s.n}/${c.layouts[k].length} • исп. ${MP.pct(s.util)} • пропил ${opts.kerf} мм`)}
        <div style="display:flex;gap:10px"><div style="flex:3">${MP.sheetSVG(s, c, { cls: 'w-full' })}</div>
        <table style="flex:2;font:10px 'JetBrains Mono',monospace;border-collapse:collapse;align-self:flex-start">${'<tr><th style="text-align:left">№</th><th style="text-align:left">Деталь</th><th>L×W</th><th>Кромка</th></tr>' + ids.map((id) => { const p = partByPos(id); return `<tr style="border-top:1px solid #ccc"><td>#${String(id).padStart(2, '0')}</td><td>${esc(p.name)} (${esc(p.module)})</td><td>${p.L}×${p.W}</td><td>${['L1', 'L2', 'W1', 'W2'].map((e) => p.edge[e] || '-').join('/')}</td></tr>`; }).join('')}</table></div></section>`;
    }));
    printDoc('a4', html);
  }
  function quotePrint() {
    return `<section style="font-family:Geist,sans-serif">${head('Коммерческое предложение')}<h2 style="font:600 20px 'Space Grotesk'">${esc(MP.project.title)}</h2><p>${esc(MP.client.name)}, ${esc(MP.client.address)}. Корпус: ${c.mats.ldsp.name}; фасады: МДФ 18 мм ${MP.decor('facade', c.decor.facade).name}${c.matKeys.filter((k) => k.startsWith('mdf-')).length > 1 ? ' (+ отдельные модули в другом цвете)' : ''}; столешница 38 мм ${MP.decor('top', c.decor.top).name}.</p>
      <table style="width:100%;border-collapse:collapse;margin-top:10px">${c.quote.map((q) => `<tr style="border-bottom:1px solid #ccc"><td style="padding:6px 0">${q.name}</td><td style="text-align:right">${f(q.sum)} сом</td></tr>`).join('')}<tr><td style="padding:8px 0"><b>Итого</b></td><td style="text-align:right"><b>${f(c.price)} сом</b></td></tr></table>
      <p style="margin-top:10px">Аванс ${f(MP.project.prepaid)} сом, остаток ${f(c.price - MP.project.prepaid)} сом при сдаче. Срок изготовления: до ${MP.project.due}.</p></section>`;
  }
  document.getElementById('pdf').onclick = printCut;

  function renderAll() { renderMats(); renderSheet(); renderRemnants(); renderSpec(); renderDocs(); }
  renderAll();
  if (['#docs', '#diff', '#drawings'].includes(MP.hash())) { if (MP.hash() !== '#docs') docTab = MP.hash().slice(1); setMode('docs'); renderDocs(); } else setMode('cut');
});
</script>
<script type="text/x-page" data-for="soon">MP.ready(() => { const s = MP.query().get('s'); if (MP.sections[s]) { document.getElementById('title').textContent = MP.sections[s] + ' — скоро'; document.title = MP.sections[s] + ' — MebelPro KG'; } });</script>
<div id="print-area"></div>
<script>
(function () {
  var r = MP.route();
  var t = document.querySelector('template[data-page="' + r.page + '"]') || document.querySelector('template[data-page="index"]');
  var page = t.getAttribute('data-page');
  document.body.dataset.shell = t.getAttribute('data-shell');
  document.body.dataset.active = t.getAttribute('data-active');
  if (page === 'soon') {
    var s = MP.query().get('s') || '';
    document.body.dataset.active = s;
    if (s === 'admin') document.body.dataset.shell = 'public';
  }
  document.title = t.getAttribute('data-title');
  document.body.insertBefore(t.content.cloneNode(true), document.getElementById('print-area'));
  var code = document.querySelector('script[data-for="' + page + '"]');
  if (code) { var el = document.createElement('script'); el.textContent = code.textContent; document.body.appendChild(el); }
})();
</script>
</body>
</html>
