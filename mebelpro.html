    const free = freeSlots(mods, m, room).filter(([a, b]) => b - a >= m.w);
    if (!free.length) return null;
    let x = free[0][0];
    if (prefX != null) {
      let best = null;
      free.forEach(([a, b]) => { const cx = Math.min(Math.max(prefX - m.w / 2, a), b - m.w); const dist = Math.abs(cx + m.w / 2 - prefX); if (!best || dist < best.d) best = { x: cx, d: dist, a, b }; });
      x = best.x;
      if (x - best.a < 80) x = best.a; else if (best.b - (x + m.w) < 80) x = best.b - m.w;

  };
  // Привязка при перетаскивании: к краям соседей в том же ряду и к стенам (60 мм)
  MP.snapX = function (mods, m, x, room) {
    x = Math.max(0, Math.min(room.L - m.w, x));
    const edges = [0, room.L];
    mods.forEach((o) => { if (o.id !== m.id && sameRow(o, m)) edges.push(o.x, o.x + o.w); });
    let best = null;
    edges.forEach((e) => [e, e - m.w].forEach((cand) => { const d = Math.abs(cand - x); if (d < 60 && (!best || d < best.d)) best = { x: cand, d }; }));
    return Math.round(best ? best.x : x);
  };
  // Прижать модуль к соседу слева (-1) или справа (+1)
  MP.pushX = function (mods, m, room, dir) {
    const row = mods.filter((o) => o.id !== m.id && sameRow(o, m));
    if (dir < 0) return Math.round(row.filter((o) => o.x + o.w <= m.x + 0.5).reduce((s, o) => Math.max(s, o.x + o.w), 0));
    return Math.round(row.filter((o) => o.x >= m.x + m.w - 0.5).reduce((s, o) => Math.min(s, o.x), room.L) - m.w);
  };
  // Фальш-планки: щели 4–149 мм между модулями и до стены закрываются планкой в цвет фасадов
  MP.fillersFor = function (mods, room) {
    const out = [];
    const rows = [mods.filter((m) => m.z < 100 && m.type !== 'upper' && m.type !== 'island'), mods.filter((m) => m.z < 100 && (m.type === 'upper' || m.type === 'tall'))];
    rows.forEach((row, ri) => {
      const list = row.slice().sort((a, b) => a.x - b.x);
      if (!list.length) return;
      const seq = [{ x: 0, w: 0, wall: true }].concat(list, [{ x: room.L, w: 0, wall: true }]);
      for (let i = 0; i < seq.length - 1; i++) {
        const a = seq[i], b = seq[i + 1], gap = b.x - (a.x + a.w);
        if (gap < 4 || gap >= 150) continue;
        const nb = [a, b].filter((o) => !o.wall);

        if (ri === 1 && !nb.some((o) => o.type === 'upper')) continue;

      }

  };

  /* ---------- Шаблоны и автоматическая расстановка ---------- */
  const fromCat = (code, x, extra) => {
    const m = Object.assign(clone(MP.catalog.find((c) => c.code === code)), extra || {});
    delete m.group;
    m.id = newId(); m.x = Math.round(x); m.y = MP.layerY(m);

  // Ширины модулей для отрезка: остаток < 150 мм уходит под фальш-планку
  function fillRun(len) {

    while (len >= 300) {

  }
  MP.autoKitchen = function (room, island, plan) {

  MP.autoWardrobe = function (room) {

  MP.templates = [

  function partsForModule(m, t, decor) {

  function hardwareForModule(m) {
    const H = {}, inc = (k, n) => { if (n > 0) H[k] = (H[k] || 0) + n; };

  MP.hardwareFor = hardwareForModule;

  function aggregate(parts) {
    const map = new Map();
    parts.forEach((p) => {
      const k = [p.mid, p.name, p.mat, p.L, p.W, JSON.stringify(p.edge)].join('|');
      if (map.has(k)) map.get(k).qty += p.qty; else map.set(k, Object.assign({}, p));
    });
    const out = [...map.values()];
    const order = { carcass: 0, drawers: 1, facades: 2, back: 3 };
    out.sort((a, b) => order[a.group] - order[b.group] || a.mid.localeCompare(b.mid, 'ru', { numeric: true }));
    out.forEach((p, i) => { p.pos = i + 1; p.code = 'MP104-' + String(i + 1).padStart(2, '0'); p.cnc = (p.module + '_' + (i + 1)).replace(/[^A-Za-z0-9_]/g, (c) => ({ 'Н': 'N', 'В': 'V', 'П': 'P', 'У': 'U', 'М': 'M', 'Д': 'D', 'Я': 'Y', 'Г': 'G', 'С': 'S', 'Ж': 'Z' }[c] || '')) + '.nc'; });
    return out;
  }

  /* ---------- Гильотинный раскрой (подходит для форматно-раскроечного станка) ---------- */
  MP.pack = function (items, opt) {
    const K = opt.kerf, UW = opt.L - 2 * opt.trim + K, UH = opt.W - 2 * opt.trim + K;
    function run(list) {
      const sheets = [];
      for (const it of list) {
        const w = it.w + K, h = it.h + K;
        let placed = false;
        for (const s of sheets) if (insert(s, it, w, h)) { placed = true; break; }
        if (!placed) {
          const s = { free: [{ x: 0, y: 0, w: UW, h: UH }], parts: [] };
          sheets.push(s);
          if (!insert(s, it, w, h)) s.parts.push({ x: 0, y: 0, w: it.w, h: it.h, ref: it.ref, oversize: true });
        }
      }
      return sheets;
    }
    function insert(s, it, w, h) {
      let best = null;
      s.free.forEach((f, i) => {
        [[w, h, false], [h, w, true]].forEach(([ww, hh, rot]) => {
          if (rot && !it.rotate) return;
          if (ww <= f.w && hh <= f.h) {
            const ss = Math.min(f.w - ww, f.h - hh), ls = Math.max(f.w - ww, f.h - hh);
            if (!best || ss < best.ss || (ss === best.ss && ls < best.ls)) best = { i, f, ww, hh, rot, ss, ls };
          }
        });
      });
      if (!best) return false;
      const { f, ww, hh } = best;
      s.free.splice(best.i, 1);
      const rw = f.w - ww, rh = f.h - hh;
      let a, b;
      if (rw < rh) { a = { x: f.x + ww, y: f.y, w: rw, h: hh }; b = { x: f.x, y: f.y + hh, w: f.w, h: rh }; }
      else { a = { x: f.x + ww, y: f.y, w: rw, h: f.h }; b = { x: f.x, y: f.y + hh, w: ww, h: rh }; }
      [a, b].forEach((r) => { if (r.w > K && r.h > K) s.free.push(r); });
      s.parts.push({ x: f.x, y: f.y, w: ww - K, h: hh - K, rot: best.rot, ref: it.ref });
      return true;
    }
    const orders = [
      (a, b) => b.w * b.h - a.w * a.h,
      (a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h),
      (a, b) => Math.min(b.w, b.h) - Math.min(a.w, a.h) || Math.max(b.w, b.h) - Math.max(a.w, a.h)
    ];
    const area = (s) => s.parts.reduce((t, p) => t + p.w * p.h, 0);
    let best = null;
    orders.forEach((o) => {
      const r = run(items.slice().sort(o));
      if (!best || r.length < best.length || (r.length === best.length && area(r[r.length - 1]) < area(best[best.length - 1]))) best = r;
    });
    return best.map((s, i) => {
      const used = area(s);
      const rem = s.free.map((f) => ({ x: f.x, y: f.y, w: f.w - K, h: f.h - K })).filter((f) => f.w >= 200 && f.h >= 200).sort((p, q) => q.w * q.h - p.w * p.h)[0] || null;
      return { n: i + 1, parts: s.parts, util: used / (opt.L * opt.W), used, remnant: rem, trim: opt.trim, L: opt.L, W: opt.W };
    });
  };

  /* ---------- Проверки перед производством ---------- */
  function checks(mods, room, plan) {
    const out = [], box = (m) => ({ x0: m.x, x1: m.x + m.w, y0: m.y, y1: m.y + m.h, z0: m.z, z1: m.z + m.d });
    const ov = (a, b) => Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0) > 0.5 && Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0) > 0.5 && Math.min(a.z1, b.z1) - Math.max(a.z0, b.z0) > 0.5;
    const clashes = [];
    for (let i = 0; i < mods.length; i++) for (let j = i + 1; j < mods.length; j++) if (ov(box(mods[i]), box(mods[j]))) clashes.push(mods[i].code + ' ↔ ' + mods[j].code);
    const outside = mods.filter((m) => m.x < 0 || m.z < 0 || m.x + m.w > room.L || m.z + m.d > room.W || m.y + m.h > room.H).map((m) => m.code);
    out.push({ key: 'collide', title: 'Пересечения модулей', status: clashes.length || outside.length ? 'error' : 'ok',
      text: clashes.length ? 'Пересекаются: ' + clashes.join(', ') : outside.length ? 'Выходят за стены: ' + outside.join(', ') : 'Модули не пересекаются и помещаются в комнату ' + room.L + '×' + room.W + ' мм.' });

    const U = MP.utilitiesFor(room, plan), sockBad = [];
    U.sockets.forEach((s) => { const b = { x0: s.x - 40, x1: s.x + 40, y0: s.y - 40, y1: s.y + 40, z0: 0, z1: 20 }; mods.forEach((m) => { if (ov(b, box(m))) sockBad.push(m.code); }); });
    let gasGap = Infinity;
    mods.forEach((m) => {
      const dx = Math.max(m.x - (U.gas.x + U.gas.r), (U.gas.x - U.gas.r) - (m.x + m.w), 0);
      const dz = Math.max(m.z - (U.gas.z + U.gas.r), (U.gas.z - U.gas.r) - (m.z + m.d), 0);
      gasGap = Math.min(gasGap, Math.hypot(dx, dz));
    });
    const sink = mods.find((m) => m.sink);
    const waterOk = !sink || U.water.every((w) => w.x > sink.x && w.x < sink.x + sink.w);
    out.push({ key: 'utils', title: 'Коммуникации', status: sockBad.length || gasGap < 5 ? 'error' : !waterOk || gasGap < 15 ? 'warn' : 'ok',
      text: (sockBad.length ? 'Розетки перекрыты: ' + [...new Set(sockBad)].join(', ') + '. ' : '3 розетки 220V свободны. ') +
        'Зазор до газового стояка ' + Math.round(gasGap) + ' мм. ' + (!sink ? 'Мойки в проекте нет.' : waterOk ? 'Выводы воды в зоне мойки.' : 'Выводы воды вне шкафа под мойку!') });

    const shallow = mods.filter((m) => (m.front === 'drawers3' || m.front === 'oven') && m.d < 510).map((m) => m.code);
    const wide = mods.filter((m) => MP.frontsFor(m).some((f) => f.kind === 'door' && f.w > 600)).map((m) => m.code);
    out.push({ key: 'hardware', title: 'Фурнитура', status: shallow.length ? 'error' : wide.length ? 'warn' : 'ok',
      text: shallow.length ? 'Глубина < 510 мм — не встанут направляющие 500 мм: ' + shallow.join(', ') : wide.length ? 'Двери шире 600 мм (нагрузка на петли): ' + wide.join(', ') : 'Петли 110° и направляющие 500 мм подходят по размерам.' });

    const wallTop = mods.filter((m) => m.z < 100 && isBaseLike(m)).reduce((z, m) => Math.max(z, m.z + m.d + 40), 0);
    const isl = mods.filter((m) => m.type === 'island');
    const pass = isl.length ? Math.min(...isl.map((m) => m.z)) - 40 - wallTop : null;
    out.push({ key: 'passage', title: 'Проход до острова', status: pass === null ? 'ok' : pass >= 900 ? 'ok' : pass >= 800 ? 'warn' : 'error',
      text: pass === null ? 'Острова нет.' : 'Проход ' + Math.round(pass) + ' мм (норма от 900 мм).' });

    const oven = mods.find((m) => m.type === 'oven');
    const hood = oven && mods.find((m) => m.type === 'upper' && m.x < oven.x + oven.w && m.x + m.w > oven.x);
    const hob = hood ? hood.y - (oven.y + oven.h + MP.settings.topT) : null;
    out.push({ key: 'hob', title: 'Над варочной панелью', status: hob === null || hob >= 650 ? 'ok' : 'error',
      text: hob === null ? 'Над варочной панелью шкафов нет.' : 'От варочной панели до шкафа ' + Math.round(hob) + ' мм (норма от 650 мм).' });

    const holes = [];
    [mods.filter((m) => m.z < 100 && m.type !== 'upper' && m.type !== 'island'), mods.filter((m) => m.z < 100 && m.type === 'upper'), mods.filter((m) => m.type === 'island')].forEach((row) => {
      const l = row.slice().sort((a, b) => a.x - b.x);

      e += `<rect x="${o.offset}" y="${Y((o.sill || 0) + o.height)}" width="${o.width}" height="${o.height}" fill="${o.kind === 'door' ? '#efe3cf' : '#d7ecff'}" stroke="${o.kind === 'door' ? '#7f5b33' : '#0284c7'}" stroke-width="5"/>` +
        `<text class="sm" x="${o.offset + o.width / 2}" y="${Y((o.sill || 0) + o.height) - 20}">${o.kind === 'door' ? 'Дверь' : 'Окно'} ${o.width}×${o.height}${o.kind === 'window' ? ', подоконник ' + o.sill : ''}</text>`;
    });
    (plan.boxes || []).filter((b) => b.z < 60).forEach((b) => { e += `<rect x="${b.x}" y="${Y(b.h || H)}" width="${b.w}" height="${b.h || H}" fill="#d6dbe4" stroke="#707881" stroke-width="4"/>`; });
    const low = wallMods.filter((m) => m.type !== 'upper');
    const baseRun = low.filter((m) => !m.noTop && m.type !== 'tall');
    if (baseRun.length) {
      const x0 = Math.min(...baseRun.map((m) => m.x)), x1 = Math.max(...baseRun.map((m) => m.x + m.w)), top = Math.max(...baseRun.map((m) => m.y + m.h));
      e += `<rect class="tp" x="${x0}" y="${Y(top + MP.settings.topT)}" width="${x1 - x0}" height="${MP.settings.topT}"/>`;
    }
    wallMods.forEach((m) => {
      if (m.type !== 'upper') e += `<rect class="pl" x="${m.x}" y="${Y(m.y)}" width="${m.w}" height="${m.y}"/>`;
      e += `<rect class="m" x="${m.x}" y="${Y(m.y + m.h)}" width="${m.w}" height="${m.h}"/>`;
      MP.frontsFor(m).forEach((f) => {
        e += `<rect class="f" x="${m.x + f.x}" y="${Y(m.y + f.y + f.h)}" width="${f.w}" height="${f.h}"/>`;
        if (f.kind === 'door') { const hx = f.hinge === 'R' ? m.x + f.x + f.w : m.x + f.x, ox = f.hinge === 'R' ? m.x + f.x : m.x + f.x + f.w; e += `<polyline points="${ox},${Y(m.y + f.y + f.h)} ${hx},${Y(m.y + f.y + f.h / 2)} ${ox},${Y(m.y + f.y)}" fill="none" stroke="#93ccff" stroke-width="3" stroke-dasharray="20 14"/>`; }
      });
      e += `<text class="lb" x="${m.x + m.w / 2}" y="${Y(m.y + m.h / 2) + 16}">${esc(m.code)}</text>`;
    });
    c.fillers.forEach((f) => { e += `<rect class="fl" x="${f.x}" y="${Y(f.y + f.h)}" width="${f.w}" height="${f.h}"/>`; });
    UT.water.forEach((w) => { e += `<circle cx="${w.x}" cy="${Y(w.y)}" r="26" fill="${w.hot ? '#ef4444' : '#0284c7'}" class="u"/>`; });
    UT.sockets.forEach((s) => { e += `<rect x="${s.x - 35}" y="${Y(s.y) - 35}" width="70" height="70" fill="#fff" stroke="#131b2e" class="u"/>`; });
    e += `<line x1="${UT.gas.x}" y1="0" x2="${UT.gas.x}" y2="${H}" stroke="#eab308" stroke-width="10"/>`;
    // Цепочки размеров
    const chain = (list, y) => list.slice().sort((a, b) => a.x - b.x).map((o) => dimH(o.x, o.x + o.w, y, o.w)).join('');
    e += chain(low.concat(c.fillers.filter((f) => f.row === 'low')), H + 140);
    if (low.length) { const x0 = Math.min(...low.map((m) => m.x)), x1 = Math.max(...low.map((m) => m.x + m.w)); e += dimH(x0, x1, H + 300, 'Итого ' + (x1 - x0)); if (x0 > 0) e += dimH(0, x0, H + 140, x0); }
    const ups = wallMods.filter((m) => m.type === 'upper');
    e += chain(ups.concat(c.fillers.filter((f) => f.row === 'up')), -110);
    e += dimH(0, L, H + 460, 'Стена А ' + L);
    // Высоты
    const levels = [0, 100];
    if (baseRun.length) { const top = Math.max(...baseRun.map((m) => m.y + m.h)); levels.push(top, top + MP.settings.topT); }
    if (ups.length) { levels.push(Math.min(...ups.map((m) => m.y)), Math.max(...ups.map((m) => m.y + m.h))); }
    low.filter((m) => m.type === 'tall').forEach((m) => levels.push(m.y + m.h));
    levels.push(H);
    const lv = [...new Set(levels.map(Math.round))].sort((a, b) => a - b);
    for (let i = 0; i < lv.length - 1; i++) e += dimV(Y(lv[i]), Y(lv[i + 1]), -140, lv[i + 1] - lv[i]);
    const elevation = `<svg viewBox="-330 -260 ${L + 480} ${H + 820}" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">${css}${e}<text class="sm" x="${L / 2}" y="${-190}">Развёртка стены А • вид спереди • ${MP.esc(MP.project.title)}</text></svg>`;

    /* --- План сверху --- */
    let p = `<rect class="w" x="0" y="0" width="${L}" height="${W}"/><line x1="0" y1="0" x2="${L}" y2="0" stroke="#131b2e" stroke-width="14"/><line x1="0" y1="0" x2="0" y2="${W}" stroke="#131b2e" stroke-width="14"/>`;
    p += `<text class="sm" x="${L / 2}" y="-40">Стена А</text><text class="sm" transform="translate(-40,${W / 2}) rotate(-90)">Стена Б</text><text class="sm" transform="translate(${L + 60},${W / 2}) rotate(90)">Стена В</text><text class="sm" x="${L / 2}" y="${W + 80}">Стена Г</text>`;
    p += MP.planOpeningsSVG(plan, room);
    c.tops.forEach((tp) => {
      const list = tp.key === 'wall' ? mods.filter((m) => m.z < 100 && !m.noTop && m.type !== 'upper' && m.type !== 'tall') : mods.filter((m) => m.type === 'island');
      if (!list.length) return;
      const x0 = Math.min(...list.map((m) => m.x)), x1 = Math.max(...list.map((m) => m.x + m.w));
      const z0 = tp.key === 'wall' ? 0 : Math.min(...list.map((m) => m.z)) - 40;
      p += `<rect class="tp" x="${x0}" y="${z0}" width="${x1 - x0}" height="${tp.depth}" opacity=".55"/>`;
    });
    mods.filter((m) => m.type !== 'upper').forEach((m) => { p += `<rect class="m" x="${m.x}" y="${m.z}" width="${m.w}" height="${m.d}" fill-opacity=".7"/><text class="lb" x="${m.x + m.w / 2}" y="${m.z + m.d / 2 + 16}">${esc(m.code)}</text>`; });
    mods.filter((m) => m.type === 'upper').forEach((m) => { p += `<rect x="${m.x}" y="${m.z}" width="${m.w}" height="${m.d}" fill="none" stroke="#006194" stroke-width="3" stroke-dasharray="18 12"/>`; });
    c.fillers.filter((f) => f.row === 'low').forEach((f) => { p += `<rect class="fl" x="${f.x}" y="0" width="${f.w}" height="${f.d}"/>`; });
    const isl = mods.filter((m) => m.type === 'island');
    if (isl.length) {
      const zf = Math.min(...isl.map((m) => m.z)) - 40, xc = (Math.min(...isl.map((m) => m.x)) + Math.max(...isl.map((m) => m.x + m.w))) / 2;
      p += dimV(zf, 600, xc, 'Проход ' + Math.round(zf - 600));
      p += dimH(Math.min(...isl.map((m) => m.x)), Math.max(...isl.map((m) => m.x + m.w)), Math.max(...isl.map((m) => m.z + m.d)) + 520, 'Остров ' + (Math.max(...isl.map((m) => m.x + m.w)) - Math.min(...isl.map((m) => m.x))));
    }
    p += dimH(0, L, W + 160, L) + dimV(W, 0, L + 160, W);
    UT.water.forEach((w) => { p += `<circle cx="${w.x}" cy="40" r="26" fill="${w.hot ? '#ef4444' : '#0284c7'}"/>`; });
    p += `<circle cx="${UT.gas.x}" cy="${UT.gas.z}" r="30" fill="#eab308"/>`;
    const planSvg = `<svg viewBox="-260 -260 ${L + 560} ${W + 560}" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">${css}${p}</svg>`;
    return { elevation, plan: planSvg };
  };
})();
</script>
<script>
/* MebelPro KG — общая оболочка: шапка/подвал сайта, боковое меню ERP, навигация, тосты, RU/KG */
(function () {
  const MP = (window.MP = window.MP || {});
  const queue = [];
  let ready = false;
  MP.ready = (fn) => (ready ? fn() : queue.push(fn));

  /* ---------- Маршруты: многофайловый режим (x.html#sub?q) и один файл (mebelpro.html#/x/sub?q) ---------- */
  MP.single = !!window.MP_SINGLE;
  function parse() {
    if (!MP.single) {
      const page = (location.pathname.split('/').pop() || 'index.html').replace(/\.html$/, '') || 'index';
      return { page, sub: location.hash.slice(1), query: location.search };
    }
    const h = location.hash.replace(/^#\/?/, '');
    const qi = h.indexOf('?'), path = qi < 0 ? h : h.slice(0, qi), q = qi < 0 ? '' : h.slice(qi);
    const parts = path.split('/');
    return { page: parts[0] || 'index', sub: parts.slice(1).join('/'), query: q };
  }
  MP.route = parse;
  MP.hash = () => { const s = parse().sub; return s ? '#' + s : ''; };
  MP.query = () => new URLSearchParams(parse().query);
  MP.toRoute = (href) => {
    const m = String(href).match(/^([\w-]+)\.html(\?[^#]*)?(#.*)?$/);
    return m ? '#/' + m[1] + (m[3] ? '/' + m[3].slice(1) : '') + (m[2] || '') : null;
  };
  MP.go = (href) => {
    if (!MP.single) { location.href = href; return; }
    const r = MP.toRoute(href);
    if (!r) return;
    if (r === location.hash) location.reload(); else location.hash = r;
  };
  MP.setHash = (h) => {
    if (!MP.single) { history.replaceState(null, '', h || location.pathname.split('/').pop() + location.search); return; }
    const r = parse();
    history.replaceState(null, '', '#/' + r.page + (h ? '/' + h.slice(1) : '') + r.query);
  };
  if (MP.single) {
    // Каждый переход — чистая загрузка экрана: не копятся обработчики и 3D-сцены
    window.addEventListener('hashchange', () => location.reload());
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href]');
      if (!a || a.target || a.hasAttribute('download') || e.ctrlKey || e.metaKey) return;
      const href = a.getAttribute('href');
      if (href.startsWith('#') && !href.startsWith('#/')) {
        e.preventDefault();
        const el = document.getElementById(href.slice(1));
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      if (MP.toRoute(href)) { e.preventDefault(); MP.go(href); }

  }

  /* ---------- Тосты ---------- */
  MP.toast = function (msg, title, kind) {

    if (!box) { box = document.createElement('div'); box.id = 'mp-toasts'; box.className = 'fixed bottom-4 right-4 z-[90] flex flex-col gap-2 max-w-sm print:hidden'; document.body.appendChild(box); }

    box.appendChild(el);

    setTimeout(() => { el.classList.add('opacity-0'); setTimeout(() => el.remove(), 300); }, 4200);
  };

  MP.download = function (name, text, type) {
    const blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };

  document.addEventListener('DOMContentLoaded', () => {
    const body = document.body, shell = body.dataset.shell, active = body.dataset.active;
    if (shell === 'public') {
      body.insertAdjacentHTML('afterbegin', publicHeader(active));
      const main = document.getElementById('page');
      if (main) main.insertAdjacentHTML('afterend', publicFooter());
    } else if (shell === 'app') {
      body.insertAdjacentHTML('afterbegin', appShell(active));
      const main = document.getElementById('page');
      if (main) { const wrap = document.createElement('div'); wrap.className = 'lg:pl-64'; main.parentNode.insertBefore(wrap, main); wrap.appendChild(main); }
      const aside = document.getElementById('mp-aside'), back = document.getElementById('mp-backdrop');
      const toggle = (open) => { aside.classList.toggle('-translate-x-full', !open); back.classList.toggle('hidden', !open); };
      document.getElementById('mp-aside-btn').addEventListener('click', () => toggle(aside.classList.contains('-translate-x-full')));
      back.addEventListener('click', () => toggle(false));
    }
    const mb = document.getElementById('mp-menu-btn');
    if (mb) mb.addEventListener('click', () => { const n = document.getElementById('mp-mobile-nav'); n.classList.toggle('hidden'); n.classList.toggle('flex'); });

    document.addEventListener('click', (e) => {
      const l = e.target.closest('[data-lang]');
      if (l) {
        lang = l.dataset.lang;
        try { localStorage.setItem('mebelpro_lang', lang); } catch (err) { /* */ }
        MP.toast(lang === 'kg' ? 'Кыргызча: азырынча меню гана которулду (демо).' : 'Интерфейс на русском языке.', lang === 'kg' ? 'Тил: KG' : 'Язык: RU', 'info');
        setTimeout(() => location.reload(), 900);
        return;
      }
      const t = e.target.closest('[data-toast]');
      if (t) MP.toast(t.dataset.toast, t.dataset.toastTitle || '', t.dataset.toastKind || 'info');
    });

    MP.bind();
    ready = true;
    queue.splice(0).forEach((fn) => { try { fn(); } catch (err) { console.error(err); } });
  });

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* MebelPro KG — 3D-сцена кухни на Three.js (r128).

(function () {

  function label(text, color) {

  // Процедурная текстура декора: древесные волокна или прожилки мрамора
  function decorTexture(d) {
    if (!d.pattern) return null;

    c.width = c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = d.color; x.fillRect(0, 0, 256, 256);

    const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);

        const y = rnd() * 256, a = 0.05 + rnd() * 0.12;

  }

  class Viewer {
    constructor(container, opts) {
      this.c = container;

      this.room = this.o.room;
      this.t = this.o.t || 16;

      this.selected = null;
      this.explodeT = 0; this.explodeGoal = 0;
      this.mode = 'day'; this.wire = false; this.wallsOn = true; this.dimsOn = this.o.dims;

      const R = (this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }));
      R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
      Object.assign(R.domElement.style, { display: 'block', width: '100%', height: '100%', touchAction: this.o.touchScroll ? 'pan-y' : 'none', outline: 'none' });

      this.camera = new THREE.PerspectiveCamera(38, 1, 0.5, 600);
      this.orbit = VIEWS.persp(this.room);
      this.goal = null;

      this.hemi = new THREE.HemisphereLight(0xffffff, 0xd9dee8, 0.62);
      this.scene.add(this.hemi);
      this.sun = new THREE.DirectionalLight(0xffffff, 0.8);
      this.sun.position.set(this.room.L / S + 18, 48, this.room.W / S + 30);
      this.sun.castShadow = true;
      this.sun.shadow.mapSize.set(2048, 2048);
      Object.assign(this.sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 160 });
      this.sun.target.position.set(this.room.L / 2 / S, 0, this.room.W / 2 / S);
      this.scene.add(this.sun, this.sun.target);
      this.ledLights = [new THREE.PointLight(0xffc27a, 0, 26, 1.4), new THREE.PointLight(0xffc27a, 0, 26, 1.4)];
      this.ledLights.forEach((l) => this.scene.add(l));

      this.mats = this.makeMats();
      this.fMats = {};
      this.applyDecor(this.o.decor || MP.defaultDecor);
      this.buildStatic();
      this.modRoot = new THREE.Group();
      this.scene.add(this.modRoot);

      this.selBox.material.depthTest = false; this.selBox.renderOrder = 15; this.selBox.visible = false;

    }

    makeMats() {
      const L = (c, extra) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, extra || {}));
      const m = {
        carcass: L(0xf3f2ee), facade: L(0x30353d), top: L(0xb4824b), hdf: L(0xe6e2da), metal: L(0x9aa3ae), plinth: L(0x16181c),
        appl: L(0x1c1f25), glass: L(0x2a3442), wall: L(0xeef1f6, { transparent: true, opacity: 0.94 }), wallB: L(0xe9edf4, { transparent: true, opacity: 0.94 }),
        floor: L(0xd9d2c5), cold: L(0x0284c7), hot: L(0xef4444), socket: L(0xffffff), gas: L(0xeab308), sink: L(0xa9b1bb), hob: L(0x0d0f12),
        windowGlass: L(0x9fd3ff, { transparent: true, opacity: 0.35 }), frame: L(0xffffff), door: L(0xd8c3a0), column: L(0xd6dbe4),
        led: new THREE.MeshBasicMaterial({ color: 0xfff1d6 })
      };
      this.wireable = ['carcass', 'facade', 'top', 'hdf', 'metal', 'plinth', 'appl', 'glass', 'sink', 'hob'].map((k) => m[k]);
      return m;
    }

    box(sx, sy, sz, mat) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(Math.max(sx, 0.01), Math.max(sy, 0.01), Math.max(sz, 0.01)), mat);
      mesh.castShadow = true; mesh.receiveShadow = true;
      return mesh;
    }

    buildStatic() {
      const r = this.room, L = r.L / S, W = r.W / S, H = r.H / S, M = this.mats;
      const g = (this.staticGroup = new THREE.Group());
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(L, W), M.floor);
      floor.rotation.x = -Math.PI / 2; floor.position.set(L / 2, 0, W / 2); floor.receiveShadow = true;
      g.add(floor);
      const grid = new THREE.GridHelper(Math.max(L, W), Math.max(L, W), 0x0284c7, 0xb9b2a5);
      grid.position.set(Math.max(L, W) / 2, 0.01, Math.max(L, W) / 2);
      grid.material.transparent = true; grid.material.opacity = 0.25;
      g.add(grid);
      // Стены A (z=0), B (x=0), C (x=L), D (z=W) с проёмами окон и дверей
      const plan = this.plan || MP.defaultPlan;
      const WALL = {
        A: { len: r.L, dir: V(1, 0, 0), nrm: V(0, 0, 1), at: (a) => V(a / S, 0, 0), mat: M.wall },
        B: { len: r.W, dir: V(0, 0, 1), nrm: V(1, 0, 0), at: (a) => V(0, 0, a / S), mat: M.wallB },
        C: { len: r.W, dir: V(0, 0, 1), nrm: V(-1, 0, 0), at: (a) => V(L, 0, a / S), mat: M.wallB },
        D: { len: r.L, dir: V(1, 0, 0), nrm: V(0, 0, -1), at: (a) => V(a / S, 0, W), mat: M.wall }
      };
      this.walls = {};
      Object.keys(WALL).forEach((k) => {
        const w = WALL[k], wg = new THREE.Group();
        // Отрезок стены в мм: a0..a1 вдоль стены, y0..y1 по высоте; толщина 200 мм снаружи комнаты
        const seg = (a0, a1, y0, y1, mat, th, inset) => {
          if (a1 - a0 < 1 || y1 - y0 < 1) return null;
          const along = (a1 - a0) / S, hh = (y1 - y0) / S, t = th || 0.2;

        };
        const holes = plan.openings.filter((o) => o.wall === k).map((o) => ({ o, a0: Math.max(0, o.offset), a1: Math.min(w.len, o.offset + o.width), y0: o.sill || 0, y1: Math.min(r.H, (o.sill || 0) + o.height) })).sort((p, q) => p.a0 - q.a0);
        let cur = 0;
        holes.forEach((h) => {
          seg(cur, h.a0, 0, r.H, w.mat);
          seg(h.a0, h.a1, 0, h.y0, w.mat);
          seg(h.a0, h.a1, h.y1, r.H, w.mat);
          cur = Math.max(cur, h.a1);
          if (h.o.kind === 'window') {
            seg(h.a0, h.a1, h.y0, h.y1, M.windowGlass, 0.03, -0.1);
            seg(h.a0, h.a1, h.y0 - 30, h.y0, M.frame, 0.32, 0.06); // подоконник
          } else {
            const pivot = new THREE.Group();
            pivot.position.copy(w.at(h.a0)).setY(0);
            const leafW = (h.a1 - h.a0) / S, leaf = this.box(leafW - 0.05, (h.y1 - h.y0) / S - 0.05, 0.4, M.door);
            leaf.position.set(leafW / 2, (h.y1 - h.y0) / S / 2, 0); pivot.add(leaf);
            const v = w.dir.clone().multiplyScalar(Math.cos(0.55)).addScaledVector(w.nrm, Math.sin(0.55));
            pivot.rotation.y = Math.atan2(-v.z, v.x);
            wg.add(pivot);

        seg(cur, w.len, 0, r.H, w.mat);
        this.walls[k] = wg; g.add(wg);
      });
      // Короба и колонны
      (plan.boxes || []).forEach((bx) => {
        const b = this.box(bx.w / S, (bx.h || r.H) / S, bx.d / S, M.column);
        b.position.set((bx.x + bx.w / 2) / S, (bx.h || r.H) / 2 / S, (bx.z + bx.d / 2) / S);
        g.add(b);
      });
      const U = MP.utilitiesFor(this.room, plan);
      U.water.filter((w) => w.x < this.room.L).forEach((w) => {
        const c = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.5, 16), w.hot ? M.hot : M.cold);
        c.rotation.x = Math.PI / 2; c.position.set(w.x / S, w.y / S, 0.25); g.add(c);
      });
      U.sockets.filter((s) => s.x < this.room.L).forEach((s) => { const b = this.box(0.8, 0.8, 0.2, M.socket); b.position.set(s.x / S, s.y / S, 0.1); g.add(b); });
      if (U.gas.x < this.room.L) {
      const gas = new THREE.Mesh(new THREE.CylinderGeometry(U.gas.r / S, U.gas.r / S, H, 12), M.gas);
      gas.position.set(U.gas.x / S, H / 2, U.gas.z / S); g.add(gas);
      }
      this.scene.add(g);
    }

    setPlan(plan) {
      this.plan = plan || MP.defaultPlan;
      this.scene.remove(this.staticGroup);
      this.staticGroup.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
      this.buildStatic();
    }

    /* ---------- Модули ---------- */
    setModules(mods, t, decor) {
      this.mods = mods; if (t) this.t = t;

      this.modRoot.children.slice().forEach((ch) => { this.modRoot.remove(ch); ch.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); });
      this.panels = []; this.groups = {}; this.fronts = [];
      const runA = mods.filter((m) => m.z < 100 && ['base', 'oven', 'appliance', 'tall'].includes(m.type));
      const cx = runA.length ? (Math.min(...runA.map((m) => m.x)) + Math.max(...runA.map((m) => m.x + m.w))) / 2 : this.room.L / 2;
      mods.forEach((m) => {
        const g = this.buildModule(m);
        const off = m.type === 'island' ? V(0, 0, 2.2) : m.type === 'upper' ? V((m.x + m.w / 2 - cx) / S * 0.22, 1.6, 0) : V((m.x + m.w / 2 - cx) / S * 0.22, 0, 0);
        g.userData.off = off;
        g.visible = !this.hidden.has(m.id);
        this.groups[m.id] = g;
        this.modRoot.add(g);
      });
      this.buildTops(mods);
      this.buildDims(mods);
      this.applyWire();
      this.applyExplode(true);
      if (this.selected && !this.groups[this.selected]) this.selected = null;
      this.updateSel();
    }

    buildModule(m) {
      const M = this.mats, W = m.w / S, H = m.h / S, D = m.d / S, t = this.t / S;
      const FM = this.facadeMat(m.facade || this.decor.facade);
      const outer = new THREE.Group();
      outer.position.set(m.x / S, m.y / S, m.z / S);
      outer.userData = { mid: m.id, base: outer.position.clone() };
      const g = new THREE.Group();
      if (m.facing === '-z') { g.position.set(W, 0, D); g.rotation.y = Math.PI; }
      outer.add(g);
      const P = (sx, sy, sz, x, y, z, mat, dir, amt, parent) => {
        const mesh = this.box(sx, sy, sz, mat);
        mesh.position.set(x, y, z);
        mesh.userData.base = mesh.position.clone();
        mesh.userData.dir = V(dir[0], dir[1], dir[2]).multiplyScalar(amt === undefined ? 1.2 : amt);
        (parent || g).add(mesh); this.panels.push(mesh);
        return mesh;
      };
      const baseLike = ['base', 'oven', 'island'].includes(m.type);
      if (m.type !== 'appliance') {
        P(t, H, D, t / 2, H / 2, D / 2, M.carcass, [-1, 0, 0]);
        P(t, H, D, W - t / 2, H / 2, D / 2, M.carcass, [1, 0, 0]);
        P(W - 2 * t, t, D, W / 2, t / 2, D / 2, M.carcass, [0, -1, 0]);
        if (baseLike) {
          P(W - 2 * t, t, 0.8, W / 2, H - t / 2, D - 0.4, M.carcass, [0, 1, 0]);
          P(W - 2 * t, t, 0.8, W / 2, H - t / 2, 0.4, M.carcass, [0, 1, 0]);
        } else P(W - 2 * t, t, D, W / 2, H - t / 2, D / 2, M.carcass, [0, 1, 0]);
        if (!m.sink) P(W - 2 * t + 0.14, H - 0.2, 0.04, W / 2, H / 2, 0.18, M.hdf, [0, 0, -1], 1.6);
        const sd = D - 0.2, fill = m.fill || {}, n = m.shelves || 0, iw = W - 2 * t;
        const shelf = (y) => P(iw - 0.02, t, sd, W / 2, y, 0.2 + sd / 2, M.carcass, [0, 0, 1], 0.8);
        // Внутренние ящики — снизу корпуса
        const inner = m.type !== 'upper' ? fill.inner || 0 : 0;
        for (let i = 0; i < inner; i++) {
          const y0 = t + 0.1 + i * 1.7;
          P(iw - 0.3, 1.5, 0.16, W / 2, y0 + 0.75, D - 0.5, M.carcass, [0, 0, 1], 1.4);
          const tray = this.box(iw - 0.5, 1.1, D - 1.1, M.metal); tray.position.set(W / 2, y0 + 0.55, (D - 1.1) / 2 + 0.2); g.add(tray);
        }
        const lo = inner ? t + 0.1 + inner * 1.7 : 0;
        if (m.type === 'tall' && m.niche !== false) {
          P(iw, t, D, W / 2, 7.28, D / 2, M.carcass, [0, 0, 1], 0.6);
          P(iw, t, D, W / 2, 11.28, D / 2, M.carcass, [0, 0, 1], 0.6);
          const mw = this.box(iw - 0.3, 3.6, D - 1.4, M.appl); mw.position.set(W / 2, 9.28, D / 2 + 0.3); g.add(mw);
          const glass = this.box(Math.min(3.2, iw - 1), 2.2, 0.04, M.glass); glass.position.set(W / 2 - 0.6, 9.28, D - 0.38); g.add(glass);
          for (let i = 0; i < n; i++) shelf(11.28 + (H - 11.28) * (i + 1) / (n + 1));
        } else if (fill.rod) {
          // Платяной шкаф: верхняя полка, под ней штанга, остальные полки — внизу
          if (n) shelf(H - 3.2);
          const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, iw - 0.1, 12), M.metal);
          rod.rotation.z = Math.PI / 2; rod.position.set(W / 2, H - 3.8, D / 2); rod.castShadow = true; g.add(rod);
          for (let i = 1; i < n; i++) shelf(lo + (H * 0.38 - lo) * i / n);
        } else {
          for (let i = 0; i < n; i++) shelf(lo + (H - lo) * (i + 1) / (n + 1));
        }
        if (fill.dryer) [H * 0.3, H * 0.66].forEach((y) => {
          for (let k = 0; k < 9; k++) { const bar = this.box(0.05, 0.05, sd - 0.4, M.metal); bar.position.set(t + 0.4 + (iw - 0.8) * k / 8, y, 0.4 + sd / 2); g.add(bar); }
          const rail = this.box(iw - 0.2, 0.06, 0.06, M.metal); rail.position.set(W / 2, y, D - 0.4); g.add(rail);
        });
        if (m.type === 'oven') {
          const ov = this.box(W - 2 * t - 0.06, 5.9, D - 0.4, M.appl); ov.position.set(W / 2, 1.24 + 2.95, D / 2 + 0.2); g.add(ov);
          const gl = this.box(W - 1.4, 3.6, 0.03, M.glass); gl.position.set(W / 2, 4.0, D + 0.02); g.add(gl);
        }
      } else {
        const dw = this.box(W - 0.1, H - 0.2, D - 0.4, M.appl); dw.position.set(W / 2, H / 2, D / 2 - 0.1); g.add(dw);
      }
      if (baseLike || m.type === 'appliance' || m.type === 'tall') P(W, m.y / S - 0.02, 0.16, W / 2, -(m.y / S) / 2, D - 0.6, M.plinth, [0, -1, 0], 0.4);

      // Фасады
      MP.frontsFor(m).forEach((f) => {
        const fw = f.w / S, fh = f.h / S, fx = f.x / S, fy = f.y / S, ft = 0.18, z0 = D + 0.01;
        const pivot = new THREE.Group();
        let mesh;
        const handleW = Math.min(1.6, fw * 0.5);
        const addHandle = (parent, x, y) => { const h = this.box(handleW, 0.12, 0.2, M.metal); h.position.set(x, y, ft + 0.1); parent.add(h); };
        if (f.kind === 'door') {
          const left = f.hinge !== 'R';
          pivot.position.set(left ? fx : fx + fw, 0, z0);
          mesh = this.box(fw, fh, ft, FM); mesh.position.set(left ? fw / 2 : -fw / 2, fy + fh / 2, ft / 2); pivot.add(mesh);
          const hb = this.box(0.12, Math.min(1.6, fh * 0.3), 0.2, M.metal); hb.position.set(left ? fw - 0.35 : -fw + 0.35, m.type === 'upper' ? fy + 0.9 : fy + fh - 0.95, ft + 0.1); pivot.add(hb);
          this.fronts.push({ mid: m.id, obj: pivot, kind: 'rot', axis: 'y', open: left ? -1.85 : 1.85, cur: 0 });
        } else if (f.kind === 'lift') {
          pivot.position.set(fx, fy + fh, z0);
          mesh = this.box(fw, fh, ft, FM); mesh.position.set(fw / 2, -fh / 2, ft / 2); pivot.add(mesh);
          addHandle(pivot, fw / 2, -fh + 0.35);
          this.fronts.push({ mid: m.id, obj: pivot, kind: 'rot', axis: 'x', open: -1.6, cur: 0 });
        } else if (f.kind === 'appl') {
          pivot.position.set(fx, fy, z0);
          mesh = this.box(fw, fh, ft, FM); mesh.position.set(fw / 2, fh / 2, ft / 2); pivot.add(mesh);
          addHandle(pivot, fw / 2, fh - 0.4);
          this.fronts.push({ mid: m.id, obj: pivot, kind: 'rot', axis: 'x', open: 1.35, cur: 0 });
        } else {
          pivot.position.set(fx, fy, z0);
          mesh = this.box(fw, fh, ft, FM); mesh.position.set(fw / 2, fh / 2, ft / 2); pivot.add(mesh);
          if (f.kind === 'drawer') {
            addHandle(pivot, fw / 2, fh - 0.35);
            const tray = this.box(fw - 0.6, Math.min(fh - 0.4, 1.8), D - 0.6, M.metal); tray.position.set(fw / 2, Math.min(fh - 0.4, 1.8) / 2 + 0.2, -(D - 0.6) / 2); pivot.add(tray);
            this.fronts.push({ mid: m.id, obj: pivot, kind: 'slide', open: 4.2, cur: 0 });
          }
        }
        pivot.userData.base = pivot.position.clone();
        pivot.userData.dir = V(0, 0, 1.9);
        g.add(pivot); this.panels.push(pivot);
      });
      return outer;
    }

    buildTops(mods) {
      const M = this.mats, tt = MP.settings.topT / S;
      this.tops = [];
      const run = mods.filter((m) => m.z < 100 && ['base', 'oven', 'appliance'].includes(m.type) && !this.hidden.has(m.id) && !m.noTop);
      const mk = (x0, x1, z0, depth, y) => {
        const b = this.box(x1 - x0, tt, depth, M.top); b.position.set((x0 + x1) / 2, y + tt / 2, z0 + depth / 2);
        b.userData.base = b.position.clone(); b.userData.dir = V(0, 2.4, 0);
        this.modRoot.add(b); this.tops.push(b); return b;
      };
      if (run.length) {
        const x0 = Math.min(...run.map((m) => m.x)) / S, x1 = Math.max(...run.map((m) => m.x + m.w)) / S;
        const y = Math.max(...run.map((m) => m.y + m.h)) / S;
        mk(x0, x1, 0, 6, y);
        run.forEach((m) => {
          const W = m.w / S, X = m.x / S;
          if (m.sink) { const s = this.box(W * 0.7, 0.04, 4.2, M.sink); s.position.set(X + W / 2, y + tt + 0.02, 3); s.userData.base = s.position.clone(); s.userData.dir = V(0, 2.4, 0); this.modRoot.add(s); this.tops.push(s); }
          if (m.type === 'oven') { const h = this.box(W * 0.9, 0.04, 4.8, M.hob); h.position.set(X + W / 2, y + tt + 0.02, 3); h.userData.base = h.position.clone(); h.userData.dir = V(0, 2.4, 0); this.modRoot.add(h); this.tops.push(h); }
        });
      }
      const isl = mods.filter((m) => m.type === 'island' && !this.hidden.has(m.id));
      if (isl.length) {
        const x0 = Math.min(...isl.map((m) => m.x)) / S, x1 = Math.max(...isl.map((m) => m.x + m.w)) / S;
        const z0 = Math.min(...isl.map((m) => m.z)) / S - 0.4, y = Math.max(...isl.map((m) => m.y + m.h)) / S;
        const b = mk(x0, x1, z0, 9, y); b.userData.dir = V(0, 2.4, 2.2);
      }
      // Фальш-планки в цвет фасадов
      MP.fillersFor(mods, this.room).forEach((f) => {
        const b = this.box(f.w / S, f.h / S - 0.04, 0.18, this.facadeMat(this.decor.facade));
        b.position.set((f.x + f.w / 2) / S, (f.y + f.h / 2) / S, f.d / S + 0.1);
        b.userData.base = b.position.clone(); b.userData.dir = V(0, 0, 1.9);
        this.modRoot.add(b); this.tops.push(b);
      });
      // LED-подсветка под верхними шкафами
      this.leds = [];
      const ups = mods.filter((m) => m.type === 'upper' && !this.hidden.has(m.id) && m.h >= 500);
      ups.forEach((m) => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(m.w / S - 0.3, 0.05, 0.12), M.led);
        b.position.set((m.x + m.w / 2) / S, m.y / S - 0.03, (m.z + m.d) / S - 0.35);
        b.userData.mid = m.id; this.modRoot.add(b); this.leds.push(b);
      });
      if (ups.length) {
        const xs = ups.map((m) => (m.x + m.w / 2) / S), y = Math.min(...ups.map((m) => m.y)) / S - 0.3;
        this.ledLights[0].position.set(Math.min(...xs), y, 2.2);
        this.ledLights[1].position.set(Math.max(...xs), y, 2.2);
      }
    }

    buildDims(mods) {
      if (this.dimGroup) { this.scene.remove(this.dimGroup); this.dimGroup.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } }); }
      const g = (this.dimGroup = new THREE.Group());
      const mat = new THREE.LineBasicMaterial({ color: 0x0284c7, depthTest: false, transparent: true });
      const line = (a, b, tick) => {
        const pts = [a, b];
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const l = new THREE.Line(geo, mat); l.renderOrder = 18; g.add(l);
        [a, b].forEach((p) => { const tg = new THREE.BufferGeometry().setFromPoints([p.clone().add(tick), p.clone().sub(tick)]); const tl = new THREE.Line(tg, mat); tl.renderOrder = 18; g.add(tl); });
      };
      const add = (a, b, tick, text, color) => { line(a, b, tick); const s = label(text, color); s.position.copy(a.clone().add(b).multiplyScalar(0.5)).add(V(0, 0.75, 0)); g.add(s); };
      const runA = mods.filter((m) => m.z < 100 && m.type !== 'upper');
      if (runA.length) {
        const x0 = Math.min(...runA.map((m) => m.x)), x1 = Math.max(...runA.map((m) => m.x + m.w));
        const y = Math.max(...mods.map((m) => m.y + m.h)) / S + 1.2;
        add(V(x0 / S, y, 0.4), V(x1 / S, y, 0.4), V(0, 0.4, 0), `${x1 - x0} мм`);
      }
      const isl = mods.filter((m) => m.type === 'island');
      if (isl.length) {
        const x0 = Math.min(...isl.map((m) => m.x)), x1 = Math.max(...isl.map((m) => m.x + m.w)), z = Math.max(...isl.map((m) => m.z + m.d)) / S + 3.3;
        add(V(x0 / S, 9.6, z), V(x1 / S, 9.6, z), V(0, 0.4, 0), `Остров ${x1 - x0} мм`);
        const zf = Math.min(...isl.map((m) => m.z)) - 40, xc = (x0 + x1) / 2 / S;
        add(V(xc, 0.1, 6), V(xc, 0.1, zf / S), V(0.4, 0, 0), `Проход ${Math.round(zf - 600)} мм`, zf - 600 >= 900 ? '#006a61' : '#ba1a1a');
      }
      g.visible = this.dimsOn;
      this.scene.add(g);
    }

    /* ---------- Декоры ---------- */
    setDecorMat(mat, d) {
      if (mat.map) mat.map.dispose();
      mat.map = decorTexture(d);
      mat.color.set(mat.map ? 0xffffff : d.color);
      mat.needsUpdate = true;
    }
    applyDecor(decor) {
      this.decor = Object.assign({}, MP.defaultDecor, decor);
      this.setDecorMat(this.mats.carcass, MP.decor('carcass', this.decor.carcass));
      this.setDecorMat(this.mats.top, MP.decor('top', this.decor.top));
    }
    facadeMat(key) {
      if (!this.fMats[key]) {
        const m = new THREE.MeshLambertMaterial();
        this.setDecorMat(m, MP.decor('facade', key));
        m.wireframe = this.wire;
        this.fMats[key] = m; this.wireable.push(m);
      }
      return this.fMats[key];
    }

    /* ---------- Публичные методы ---------- */
    select(id, silent) {
      this.selected = id && this.groups[id] ? id : null;
      this.updateSel();
      if (!silent && this.o.onSelect) this.o.onSelect(this.selected ? this.mods.find((m) => m.id === this.selected) : null);
    }
    updateSel() { this.selBox.visible = !!this.selected && !this.hidden.has(this.selected); }
    setExploded(on) { this.explodeGoal = on ? 1 : 0; return on; }
    toggleExploded() { return this.setExploded(this.explodeGoal === 0); }
    toggleOpen(id) {
      const list = this.fronts.filter((f) => f.mid === id);
      const open = !list.some((f) => f.target);
      list.forEach((f) => (f.target = open));
      return open;
    }
    setLighting(mode) {
      this.mode = mode;
      const night = mode === 'night';
      this.scene.background = new THREE.Color(night ? 0x111a2e : 0xf3f5f9);
      this.hemi.intensity = night ? 0.3 : 0.62;
      this.sun.intensity = night ? 0.12 : 0.8;
      this.ledLights.forEach((l) => (l.intensity = night ? 2.4 : 0));
      this.mats.led.color.set(night ? 0xffcf8a : 0xfff1d6);
      return mode;
    }
    setView(name) { this.goal = VIEWS[name](this.room); }
    setWireframe(on) { this.wire = on; this.applyWire(); return on; }
    applyWire() { this.wireable.forEach((m) => (m.wireframe = this.wire)); }
    setDims(on) { this.dimsOn = on; if (this.dimGroup) this.dimGroup.visible = on; return on; }
    setWalls(on) { this.wallsOn = on; return on; }
    setHidden(id, hide) {
      if (hide) this.hidden.add(id); else this.hidden.delete(id);
      if (this.groups[id]) this.groups[id].visible = !hide;
      this.setModules(this.mods); // пересобрать столешницы/подсветку
    }
    zoom(f) { this.goal = null; this.orbit.r = clamp(this.orbit.r * f, 10, 130); }
    focusSelected() {
      if (!this.selected) return;
      const b = new THREE.Box3().setFromObject(this.groups[this.selected]), c = b.getCenter(V(0, 0, 0));
      this.goal = { theta: this.orbit.theta, phi: this.orbit.phi, r: 24, target: c };
    }
    snapshot() { this.renderer.render(this.scene, this.camera); return this.renderer.domElement.toDataURL('image/png'); }

    applyExplode(force) {
      const e = this.explodeT;
      if (!force && this._lastE === e) return;
      this._lastE = e;
      this.panels.forEach((p) => { p.position.copy(p.userData.base).addScaledVector(p.userData.dir, e); if (p.userData.slideZ) p.position.z += p.userData.slideZ; });
      Object.values(this.groups).forEach((g) => g.position.copy(g.userData.base).addScaledVector(g.userData.off, e));
      (this.tops || []).forEach((p) => p.position.copy(p.userData.base).addScaledVector(p.userData.dir, e));
      (this.leds || []).forEach((l) => (l.visible = e < 0.05 && !this.hidden.has(l.userData.mid)));
    }

    /* ---------- Ввод ---------- */
    bindInput() {
      const el = this.renderer.domElement, pts = new Map();
      let down = null, moved = false, pinch = 0;
      const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
      el.addEventListener('pointerdown', (e) => {
        el.setPointerCapture(e.pointerId);
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pts.size === 1) { down = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey }; moved = false; }
        if (this.moveMode && e.button === 0 && pts.size === 1 && this.o.selectable) {
          const id = this.ray(e);
          if (id) {
            const m = this.mods.find((x) => x.id === id);
            this.dragPlane = new THREE.Plane(V(0, 1, 0), -(m.y + m.h / 2) / S);
            const hit = this.planeHit(e);
            if (hit) { this.drag = { id, m, start: hit, x0: m.x, z0: m.z, x: m.x, z: m.z }; this.select(id); }
          }
        }
        if (pts.size === 2) pinch = dist();
        this.interacting = true; this.goal = null;
      });
      el.addEventListener('pointermove', (e) => {
        const p = pts.get(e.pointerId);
        if (!p) { this.hover(e); return; }
        const dx = e.clientX - p.x, dy = e.clientY - p.y;
        p.x = e.clientX; p.y = e.clientY;
        if (Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 5) moved = true;
        if (this.drag) {
          const hit = this.planeHit(e), d = this.drag, m = d.m;
          if (!hit) return;
          d.x = MP.snapX(this.mods, m, d.x0 + (hit.x - d.start.x) * S, this.room);
          if (m.type === 'island') d.z = Math.round(Math.max(0, Math.min(this.room.W - m.d, d.z0 + (hit.z - d.start.z) * S)) / 10) * 10;
          const g = this.groups[d.id];
          g.userData.base.set(d.x / S, m.y / S, d.z / S);
          g.position.copy(g.userData.base).addScaledVector(g.userData.off, this.explodeT);
          if (this.o.onDrag) this.o.onDrag(m, d.x, d.z);
          return;
        }
        if (pts.size === 2) { const d = dist(); if (pinch) this.orbit.r = clamp(this.orbit.r * pinch / d, 10, 130); pinch = d; return; }
        if (down.pan) {
          const k = this.orbit.r * 0.0016;
          const right = V(0, 0, 0).setFromMatrixColumn(this.camera.matrix, 0), up = V(0, 0, 0).setFromMatrixColumn(this.camera.matrix, 1);
          this.orbit.target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
        } else {
          this.orbit.theta -= dx * 0.006;
          this.orbit.phi = clamp(this.orbit.phi - dy * 0.006, 0.02, 1.56);
        }
      });
      const up = (e) => {
        if (!pts.has(e.pointerId)) return;
        pts.delete(e.pointerId);
        if (pts.size < 2) pinch = 0;
        if (pts.size === 0) { this.interacting = false; if (this.drag) { const d = this.drag; this.drag = null; if (moved && (d.x !== d.x0 || d.z !== d.z0) && this.o.onMove) this.o.onMove(d.id, d.x, d.z); return; } if (!moved && this.o.selectable && e.button === 0) this.pick(e); }
      };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', (e) => { pts.delete(e.pointerId); if (!pts.size) this.interacting = false; });
      el.addEventListener('contextmenu', (e) => e.preventDefault());
      if (this.o.wheelZoom) el.addEventListener('wheel', (e) => { e.preventDefault(); this.goal = null; this.orbit.r = clamp(this.orbit.r * Math.exp(e.deltaY * 0.0012), 10, 130); }, { passive: false });
    }
    planeHit(e) {
      const r = this.renderer.domElement.getBoundingClientRect();
      this.raycaster.setFromCamera({ x: ((e.clientX - r.left) / r.width) * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1 }, this.camera);
      const p = V(0, 0, 0);
      return this.raycaster.ray.intersectPlane(this.dragPlane, p) ? p : null;
    }
    floorPoint(e) {
      this.dragPlane = new THREE.Plane(V(0, 1, 0), 0);
      const p = this.planeHit(e);
      return p ? { x: p.x * S, z: p.z * S } : null;
    }
    setMoveMode(on) { this.moveMode = on; this.renderer.domElement.style.cursor = on ? 'move' : 'grab'; return on; }
    ray(e) {
      const r = this.renderer.domElement.getBoundingClientRect();
      this.raycaster.setFromCamera({ x: ((e.clientX - r.left) / r.width) * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1 }, this.camera);
      const hits = this.raycaster.intersectObjects(Object.values(this.groups).filter((g) => g.visible), true);
      for (const h of hits) { let o = h.object; while (o && !(o.userData && o.userData.mid && this.groups[o.userData.mid] === o)) o = o.parent; if (o) return o.userData.mid; }
      return null;
    }
    pick(e) { this.select(this.ray(e)); }
    hover(e) {
      if (!this.o.selectable) return;
      const now = performance.now();
      if (now - (this._hv || 0) < 60) return;
      this._hv = now;
      this.renderer.domElement.style.cursor = this.ray(e) ? (this.moveMode ? 'move' : 'pointer') : 'grab';
    }

    resize() {
      const w = this.c.clientWidth || 600, h = this.c.clientHeight || 400;
      this.camera.aspect = w / h; this.camera.updateProjectionMatrix();
      this.renderer.setSize(w, h, false);
    }

    loop() {
      requestAnimationFrame(this.loop);
      if (!this.visible) return;
      const o = this.orbit;
      if (this.goal) {
        const g = this.goal, k = 0.12;
        let dt = g.theta - o.theta; dt = Math.atan2(Math.sin(dt), Math.cos(dt));
        o.theta += dt * k; o.phi += (g.phi - o.phi) * k; o.r += (g.r - o.r) * k; o.target.lerp(g.target, k);
        if (Math.abs(dt) < 0.001 && Math.abs(g.phi - o.phi) < 0.001 && Math.abs(g.r - o.r) < 0.01) this.goal = null;
      } else if (this.o.autoRotate && !this.interacting) o.theta += 0.0016;
      const sp = Math.sin(o.phi);
      this.camera.position.set(o.target.x + o.r * sp * Math.sin(o.theta), o.target.y + o.r * Math.cos(o.phi), o.target.z + o.r * sp * Math.cos(o.theta));
      this.camera.lookAt(o.target);
      // Стены, оказавшиеся между камерой и кухней, прячем автоматически
      const cp = this.camera.position, RL = this.room.L / S, RW = this.room.W / S;
      this.walls.A.visible = this.wallsOn && cp.z > 0;
      this.walls.B.visible = this.wallsOn && cp.x > 0;
      this.walls.C.visible = this.wallsOn && cp.x < RL;
      this.walls.D.visible = this.wallsOn && cp.z < RW;
      if (Math.abs(this.explodeT - this.explodeGoal) > 0.001) { this.explodeT += (this.explodeGoal - this.explodeT) * 0.12; if (Math.abs(this.explodeT - this.explodeGoal) < 0.002) this.explodeT = this.explodeGoal; }
      this.applyExplode();
      this.fronts.forEach((f) => {
        const goal = f.target ? f.open : 0;
        if (Math.abs(f.cur - goal) < 0.001) return;
        f.cur += (goal - f.cur) * 0.14;
        if (f.kind === 'slide') { f.obj.userData.slideZ = f.cur; f.obj.position.z = f.obj.userData.base.z + f.obj.userData.dir.z * this.explodeT + f.cur; }
        else f.obj.rotation[f.axis] = f.cur;
      });
      if (this.selBox.visible) this.selBox.box.setFromObject(this.groups[this.selected]);
      this.renderer.render(this.scene, this.camera);
    }
  }

  window.MP3D = { create: (container, opts) => new Viewer(container, opts) };
})();
</script>

<script type="text/x-page" data-for="auth">
MP.ready(() => {
  const tabs = document.querySelectorAll('.tab'), reg = document.getElementById('panel-register'), log = document.getElementById('panel-login');
  const show = (k) => {
    reg.classList.toggle('hidden', k !== 'register'); reg.classList.toggle('flex', k === 'register');
    log.classList.toggle('hidden', k !== 'login'); log.classList.toggle('flex', k === 'login');
    tabs.forEach((t) => t.className = 'tab flex-1 py-2 rounded font-headline-sm text-body-lg flex items-center justify-center gap-1 ' + (t.dataset.tab === k ? 'bg-surface-container-lowest text-on-surface shadow-sm' : 'text-on-surface-variant hover:text-on-surface'));
  };
  tabs.forEach((t) => t.addEventListener('click', () => show(t.dataset.tab)));
  show(MP.hash() === '#register' ? 'register' : 'login');

  document.querySelectorAll('.eye').forEach((b) => b.addEventListener('click', () => {
    const i = b.parentNode.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password';
    b.firstElementChild.textContent = i.type === 'password' ? 'visibility' : 'visibility_off';
  }));
  const phone = document.getElementById('reg-phone');
  phone.addEventListener('input', () => {
    let v = phone.value.replace(/\D/g, ''); if (v.startsWith('996')) v = v.slice(3); v = v.slice(0, 9);
    let s = ''; if (v.length) s = '(' + v.slice(0, 3); if (v.length >= 3) s += ') '; if (v.length > 3) s += v.slice(3, 5); if (v.length > 5) s += '-' + v.slice(5, 7); if (v.length > 7) s += '-' + v.slice(7, 9);
    phone.value = s;
  });
  const fail = (form, msg) => { const e = form.querySelector('.err'); e.textContent = msg; e.classList.remove('hidden'); };
  const enter = (who, to) => {
    try { sessionStorage.setItem('mebelpro_user', who); } catch (e) { /* */ }
    MP.toast('Переход в цеховой интерфейс…', 'Вход выполнен (демо)');
    setTimeout(() => MP.go(to), 900);
  };
  reg.addEventListener('submit', (e) => {
    e.preventDefault(); const f = reg.elements;
    if (f.name.value.trim().length < 3) return fail(reg, 'Укажите имя и фамилию.');
    if (f.phone.value.replace(/\D/g, '').length !== 9) return fail(reg, 'Номер должен содержать 9 цифр после +996.');
    if (f.p1.value.length < 8) return fail(reg, 'Пароль — не короче 8 символов.');
    if (f.p1.value !== f.p2.value) return fail(reg, 'Пароли не совпадают.');
    if (!f.terms.checked) return fail(reg, 'Нужно согласие с условиями оферты.');
    reg.querySelector('.err').classList.add('hidden');
    enter(f.name.value.trim(), 'projects.html');
  });
  log.addEventListener('submit', (e) => {
    e.preventDefault(); const f = log.elements;
    if (!f.login.value.trim() || !f.pwd.value) return fail(log, 'Введите телефон или e-mail и пароль.');
    enter(f.login.value.trim(), 'dashboard.html');
  });
  document.getElementById('demo-login').addEventListener('click', () => enter(MP.company.director, 'dashboard.html'));

  const c = MP.calc(), s = c.layouts.ldsp[0];
  document.getElementById('u1').textContent = MP.pct(s.util);
  document.getElementById('mini-sheet').innerHTML = MP.sheetSVG(s, c, { labels: true, cls: 'w-full h-auto' });
});
</script>

  document.getElementById('kanban').innerHTML = MP.stages.map((s) => {

  }).join('') + `<div class="bg-surface-container-low/80 rounded-xl p-3 flex flex-col w-[240px] shrink-0 border border-surface-container-high"><div class="flex items-center justify-between mb-2 pb-1 border-b border-surface-container-high"><span class="flex items-center gap-1.5 font-label-md text-label-md font-semibold">${ico('task_alt', 'text-[16px] text-outline')}Готово / архив</span><span class="w-5 h-5 flex items-center justify-center rounded-full bg-secondary-container font-label-sm text-label-sm font-bold">${MP.archiveCount}</span></div>
    <div class="space-y-2">${MP.archive.map((a) => `<div class="p-2.5 rounded-xl bg-surface-container-lowest/80 text-on-surface-variant border border-surface-container-high/40"><div class="flex justify-between text-label-sm"><span class="line-through font-mono">#${a.id}</span><span class="text-secondary text-[11px]">Акт подписан</span></div><div class="font-body-sm font-medium text-on-surface mt-1">${a.title}</div><div class="text-label-sm font-mono mt-1">${f(a.price)} KGS • закрыт</div></div>`).join('')}<p class="text-label-sm text-center text-on-surface-variant">и ещё ${MP.archiveCount - MP.archive.length} в архиве</p></div></div>`;

  const payCell = (o) => o.stage === 'measure' ? '<span class="text-on-surface-variant">Договор не подписан</span>' :
    `<div class="flex items-center gap-1.5"><span class="px-2 py-0.5 rounded-md bg-surface-container-high font-label-sm text-label-sm font-bold">${o.pay}</span><span class="font-mono font-bold text-secondary text-label-sm">${f(o.paid)}</span></div>
     <div class="font-label-sm text-label-sm mt-1 ${o.price - o.paid ? 'text-tertiary' : 'text-secondary font-bold'}">${o.price - o.paid ? 'Остаток: ' + f(o.price - o.paid) + ' KGS' : 'Оплачено полностью'}</div>`;

  const render = () => {

      <td class="py-3 px-3 text-right font-mono font-bold">${f(o.price)} <span class="font-normal text-label-sm text-on-surface-variant">KGS</span></td>
      <td class="py-3 px-3">${payCell(o)}</td>
      <td class="py-3 px-3"><span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container text-${sg.tone} font-label-sm text-label-sm font-semibold">${ico(sg.icon, 'text-[14px]')}${sg.title}</span></td>
      <td class="py-3 px-4 text-right whitespace-nowrap">${o.id === MP.project.id ? `<a href="studio.html" title="3D-проект" class="p-1.5 rounded-lg hover:bg-surface-container-high inline-flex text-primary">${ico('view_in_ar')}</a><a href="cutting.html" title="Карта раскроя" class="p-1.5 rounded-lg hover:bg-surface-container-high inline-flex text-secondary">${ico('grid_on')}</a>` : `<button type="button" data-toast="Детальная карточка заказа #${o.id} появится вместе с серверной частью. Полный набор экранов доступен для заказа #${MP.project.id}." class="p-1.5 rounded-lg hover:bg-surface-container-high inline-flex text-on-surface-variant">${ico('open_in_new')}</button>`}</td></tr>`; }).join('') || '<tr><td colspan="8" class="p-6 text-center text-on-surface-variant">Ничего не найдено</td></tr>';
    document.getElementById('shown').textContent = `Показано ${Math.min(list.length, PER * page) - (page - 1) * PER > 0 ? (page - 1) * PER + 1 : 0}–${Math.min(list.length, page * PER)} из ${list.length}`;
    document.getElementById('pager').innerHTML = Array.from({ length: pages }, (_, i) => `<button type="button" data-page="${i + 1}" class="px-2 py-1 rounded ${i + 1 === page ? 'bg-surface-container-lowest font-semibold shadow-sm' : 'hover:bg-surface-container-high'}">${i + 1}</button>`).join('');

    <div class="w-full bg-surface-container-high h-1.5 rounded-full overflow-hidden"><div class="bg-${s.order ? 'tertiary' : s.tone} h-full" style="width:${Math.max(4, Math.round(Math.max(0, s.free) / s.have * 100))}%"></div></div></div>`).join('');
  document.getElementById('suppliers').innerHTML = [['МС', '«МебельСнаб»', 'ЛДСП Egger, Kronospan'], ['АП', '«АзияПлит»', 'AGT, МДФ, столешницы'], ['КФ', '«КыргызФурнитура»', 'BLUM, DTC, Hafele']].map(([a, n, d]) => `<div class="p-2 rounded-lg bg-surface-container-low flex items-center justify-between"><div class="flex items-center gap-2"><div class="w-9 h-9 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center font-label-md font-bold">${a}</div><div><div class="font-body-sm font-bold">${n}</div><div class="font-label-sm text-label-sm text-on-surface-variant">${d}</div></div></div><span class="font-label-sm text-label-sm text-on-surface-variant">демо-контакт</span></div>`).join('');
  document.getElementById('req').addEventListener('click', () => {
    const need = stock.filter((s) => s.order);
    if (!need.length) return MP.toast('Дефицита нет — заявка не нужна.', 'Склад в норме');

  document.getElementById('staff').innerHTML = MP.staff.map((s) => `<div class="p-3 rounded-xl bg-surface-container-low flex flex-col justify-between gap-2 border-l-2 border-l-${s.tone}">
    <div class="space-y-1"><div class="flex items-start justify-between"><span class="px-2 py-0.5 rounded bg-surface-container-highest font-label-sm text-label-sm font-bold">${s.badge}</span>${ico(s.icon, 'text-[18px] text-' + s.tone)}</div>
    <h4 class="font-body-sm font-bold">${s.role}</h4><p class="font-label-sm text-label-sm text-primary font-semibold">${s.name}</p><p class="font-body-sm text-body-sm text-on-surface-variant">${s.text}</p></div>
    <div class="pt-2 border-t border-surface-container-high space-y-1">${s.allow.map((a) => `<div class="flex items-center gap-1.5 text-label-sm text-secondary font-medium">${ico('check_circle', 'text-[14px]')}${a}</div>`).join('')}${s.deny.map((a) => `<div class="flex items-center gap-1.5 text-label-sm text-tertiary font-medium">${ico('block', 'text-[14px]')}${a}</div>`).join('')}</div></div>`).join('');

  const s1 = c.layouts.ldsp[0];
  document.getElementById('saw').textContent = MP.settings.saw + ' • ' + MP.settings.blade;
  document.getElementById('u1').textContent = MP.pct(s1.util);
  document.getElementById('r1').textContent = s1.remnant ? Math.round(s1.remnant.w) + ' × ' + Math.round(s1.remnant.h) + ' мм' : 'нет';
  document.getElementById('mini').innerHTML = MP.sheetSVG(s1, c, { labels: false });
  if (MP.hash() === '#orders') setTimeout(() => document.getElementById('orders').scrollIntoView(), 50);
});

<script type="text/x-page" data-for="projects">
MP.ready(() => {
  const f = MP.fmt, ico = MP.ico, st = MP.orderStats();

  const status = (o) => o.stage === 'measure' ? (o.isNew || o.note === 'Черновик' ? ['Черновик', 'outline'] : ['Проектирование', 'primary']) : o.stage === 'cutting' ? ['В раскрое', 'tertiary'] : ['assembly', 'install'].includes(o.stage) ? ['Производство', 'secondary'] : ['Договор', 'primary'];

  const kpis = () => {

      ['В раскрое', 'content_cut', 'tertiary', a.filter((o) => o.stage === 'cutting').length, 'в цеху'],
      ['Производство', 'handyman', 'on-surface', a.filter((o) => ['assembly', 'install'].includes(o.stage)).length, 'сборка/монтаж']
    ].map(([t, i, tone, n, s]) => `<div class="bg-surface-container-lowest p-3 rounded-lg shadow-sm"><span class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-between">${t}${ico(i, 'text-[16px] text-' + tone)}</span><div class="flex items-baseline gap-1 mt-2"><span class="font-headline-lg text-headline-lg font-bold text-${tone}">${n}</span><span class="font-label-sm text-label-sm text-on-surface-variant">${s}</span></div></div>`).join('') +
      `<a href="studio.html" class="col-span-2 bg-primary/10 rounded-lg p-3 flex items-center justify-between gap-3 hover:bg-primary/15 group"><div class="flex items-center gap-3 min-w-0"><div class="w-10 h-10 rounded-lg bg-primary text-on-primary flex items-center justify-center shrink-0">${ico('play_arrow', 'text-[22px]')}</div><div class="min-w-0"><span class="font-label-sm text-label-sm text-primary uppercase font-bold">Продолжить</span><div class="font-body-md font-semibold truncate">${MP.project.title} (#${MP.project.id})</div><span class="font-label-sm text-label-sm text-on-surface-variant">Обновлено 15 мин назад</span></div></div>${ico('arrow_forward', 'text-[20px] text-primary group-hover:translate-x-1 transition-transform')}</a>`;
  };

  let cat = '';
  const chips = () => {
    const a = all(), cnt = (k) => a.filter((o) => o.category === k).length;
    document.getElementById('chips').innerHTML = [['', 'Все', a.length]].concat(Object.entries(MP.categories).map(([k, n]) => [k, n, cnt(k)])).map(([k, n, c]) => `<button type="button" data-cat="${k}" class="px-3 py-1 rounded-full font-label-sm text-label-sm shrink-0 ${k === cat ? 'bg-primary text-on-primary font-semibold shadow-sm' : 'bg-surface-container-lowest hover:bg-surface-container-high'}">${n} (${c})</button>`).join('');
  };

  const grid = () => {
    const q = document.getElementById('q').value.trim().toLowerCase(), sort = document.getElementById('sort').value;
    let list = all().filter((o) => (!cat || o.category === cat) && (!q || [o.title, o.client, o.place, o.id].join(' ').toLowerCase().includes(q)));
    list.sort(sort === 'name' ? (a, b) => a.title.localeCompare(b.title, 'ru') : sort === 'sum' ? (a, b) => b.price - a.price : (a, b) => b.id.localeCompare(a.id));
    document.getElementById('grid').innerHTML = list.map((o) => {
      const [sn, tone] = status(o), main = o.id === MP.project.id;
      return `<article id="p-${o.id}" class="bg-surface-container-lowest rounded-xl overflow-hidden shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow group scroll-mt-24">

          ${o.img ? `<img class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="" loading="lazy" src="${o.img}" onerror="this.remove()">` : ''}

          <span class="absolute bottom-2 left-2 right-2 flex justify-between text-on-primary bg-inverse-surface/80 px-2 py-1 rounded font-label-sm text-label-sm font-mono"><span>#${o.id}</span><span>${f(o.price)} KGS</span></span></div>
        <div class="p-4 flex flex-col gap-1.5"><span class="font-label-sm text-label-sm uppercase tracking-wider text-secondary font-bold">${MP.categories[o.category]}${main ? ' • ' + MP.calc().pieces + ' деталей' : ''}</span>
          <h2 class="font-headline-sm text-headline-sm group-hover:text-primary transition-colors">${MP.esc(o.title)}</h2>
          <div class="flex items-center gap-1 text-body-sm text-on-surface-variant">${ico('person', 'text-[16px]')}${MP.esc(o.client)} • ${MP.esc(o.place)}</div>
          <div class="flex flex-wrap gap-1 mt-1">${String(o.material).split(',').map((m) => `<span class="px-1.5 py-0.5 rounded bg-surface-container font-label-sm text-label-sm">${MP.esc(m.trim())}</span>`).join('')}</div></div></div>
        <div class="p-4 pt-0 flex flex-col gap-2">${main ? `<div class="grid grid-cols-2 gap-2"><a href="studio.html" class="px-2 py-2 rounded-lg bg-primary text-on-primary font-label-md text-label-md font-semibold text-center hover:bg-primary-container inline-flex items-center justify-center gap-1">${ico('view_in_ar')}Открыть в 3D</a><a href="cutting.html" class="px-2 py-2 rounded-lg bg-surface-container hover:bg-surface-variant font-label-md text-label-md text-center inline-flex items-center justify-center gap-1">${ico('grid_view')}Раскрой</a></div>`
          : `<button type="button" data-toast="Для «${MP.esc(o.title)}» 3D-модель ещё не построена в прототипе. Полный цикл показан на заказе #${MP.project.id}." class="px-2 py-2 rounded-lg bg-surface-container-high hover:bg-surface-variant font-label-md text-label-md inline-flex items-center justify-center gap-1">${ico('view_in_ar')}Открыть в 3D</button>`}
          <div class="flex items-center justify-between text-body-sm text-on-surface-variant pt-1 border-t border-surface-container"><span class="font-label-sm text-label-sm">${o.isNew ? 'Создан сейчас' : 'Обновлено ' + o.updated}</span>
          <div class="flex gap-1">${o.isNew ? `<button type="button" data-del="${o.id}" title="Удалить черновик" class="p-1 hover:text-error">${ico('delete', 'text-[16px]')}</button>` : `<button type="button" data-toast="Копирование проектов появится вместе с серверной частью." title="Копировать" class="p-1 hover:text-primary">${ico('content_copy', 'text-[16px]')}</button>`}</div></div></div></article>`;
    }).join('') || '<p class="col-span-full text-center text-on-surface-variant py-10">Проекты не найдены</p>';
  };

  document.getElementById('chips').addEventListener('click', (e) => { const b = e.target.closest('[data-cat]'); if (b) { cat = b.dataset.cat; chips(); grid(); } });
  document.getElementById('grid').addEventListener('click', (e) => {
    const d = e.target.closest('[data-del]'); if (!d) return;

    extra = extra.filter((o) => o.id !== d.dataset.del); save(); refresh();
  });
  const save = () => { try { localStorage.setItem('mebelpro_new_projects', JSON.stringify(extra)); } catch (e) { /* */ } };

  // Модальное окно
  const modal = document.getElementById('modal');
  const open = () => { modal.classList.remove('hidden'); modal.querySelector('[name=title]').focus(); };
  const close = () => { modal.classList.add('hidden'); if (MP.hash() === '#new') MP.setHash(''); };
  document.querySelectorAll('[data-open-modal]').forEach((b) => b.addEventListener('click', open));
  modal.querySelectorAll('[data-close-modal]').forEach((b) => b.addEventListener('click', close));
  modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) close(); });
  const TYPES = [['kitchen', 'countertops', 'Кухня', 'Верх, низ, пеналы'], ['sliding', 'door_sliding', 'Шкаф-купе', 'Раздвижные системы'], ['other', 'meeting_room', 'Распашной шкаф', 'Петли, антресоли'], ['dressing', 'checkroom', 'Гардеробная', 'Модульные секции'], ['tv', 'tv', 'ТВ-зона', 'Панели, рейки'], ['hallway', 'doorbell', 'Прихожая', 'Обувницы, банкетки'], ['other', 'bathtub', 'Ванная', 'Влагостойкие модули'], ['other', 'desk', 'Стол / тумба', 'Письменные, подвесные'], ['other', 'construction', 'Другое', 'Свободный конструктор']];
